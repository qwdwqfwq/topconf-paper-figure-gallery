name: Deploy isolated chat single submission
on:
  push:
    branches: [main]
    paths:
      - forge/chat-api.mjs
      - .github/workflows/deploy-chat-single-submit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record unchanged original lock result
        id: original_lock
        continue-on-error: true
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Report original lock outcome
        env:
          ORIGINAL_OUTCOME: ${{ steps.original_lock.outcome }}
        run: echo "Original lock outcome = $ORIGINAL_OUTCOME; historical failures remain failures." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: step3-recovery-proof
          run-id: 43933237875
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/current-proof
      - uses: actions/download-artifact@v4
        with:
          name: step3-analysis-proof
          run-id: 43907732087
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/historical-proof
      - name: Preserve previous release acceptance and adversarial tests
        run: |
          historical="$RUNNER_TEMP/previous-release"
          trap 'git worktree remove --force "$historical"' EXIT
          git worktree add --detach "$historical" 5e7f1cece066ede4ed286928c724b00067b991d8
          (cd "$historical" && node scripts/check-step3-recovery-release.mjs "$RUNNER_TEMP/historical-proof/step3-analysis-proof.json" && node --test scripts/test-step3-recovery-release.mjs)
      - name: Chat transport, diagnostics and PDF regression
        run: node --test forge/test-chat-api.mjs forge/test-step3-analysis-request.mjs forge/test-openai-pdf.mjs nonelinear-relay/test-chat-stream.mjs nonelinear-relay/test-worker.mjs nonelinear-relay/test-live-chat.mjs nonelinear-relay/test-source-image.mjs nonelinear-relay/test-references.mjs scripts/test-chat-single-submit-release.mjs
      - name: Preserve bitmap and editable export regression
        run: |
          node --test forge/test-openai-token-limit.mjs forge/test-bitmap-composition.mjs forge/test-generation-intent.mjs forge/test-svg-chat-response.mjs forge/test-infistar-reconstruction-responses.mjs forge/test-infistar-reconstruction-stream.mjs
          node forge/test-editable-export.mjs
      - name: Build byte-preserving artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-chat-single-submit-release.mjs "$RUNNER_TEMP/current-proof/step3-recovery-proof.json" --prepare-pages
      - uses: actions/upload-artifact@v4
        with:
          name: chat-single-submit-proof
          path: /tmp/chat-single-submit-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/chat-single-submit-pages
      - name: Deploy isolated chat module
        id: deployment
        uses: actions/deploy-pages@v4
