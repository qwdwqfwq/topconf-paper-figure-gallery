name: Deploy Step 3 revision stage diagnostics only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-revision-diagnostics.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record original freeze check without changing its baseline
        id: original_lock
        continue-on-error: true
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Report original freeze result and verify unchanged protection
        env:
          ORIGINAL_OUTCOME: ${{ steps.original_lock.outcome }}
        run: |
          echo "Original freeze outcome = $ORIGINAL_OUTCOME; existing guard and baseline remain unchanged." >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code c1980b6dc4b060a6e6b081d24440d0384b17ba42 HEAD -- .github/forge-workflow-lock.json scripts/check-forge-workflow-lock.mjs forge/index.html
      - uses: actions/download-artifact@v4
        with:
          name: reference-analysis-direct-proof
          run-id: 44167826843
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-proof
      - name: Verify revision diagnostics and isolated publication
        run: node --test scripts/test-revision-diagnostics-release.mjs forge/test-revision-diagnostics.mjs forge/test-revision-connection-recovery.mjs forge/test-revision-entry-durable.mjs forge/test-revision-durable-task.mjs forge/test-revision-routing.mjs forge/test-revision-reader-model.mjs forge/test-revision-error-recovery.mjs
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-test" playwright@1.58.2
          "$RUNNER_TEMP/browser-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify uploaded source, repeated outages, refresh recovery and original failures
        env:
          REVISION_PLAYWRIGHT: ${{ runner.temp }}/browser-test/node_modules/playwright
          REVISION_BUNDLED_BROWSER: '1'
        run: node forge/test-revision-task-browser.cjs
      - name: Build artifact preserving every other published byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-revision-diagnostics-release.mjs "$RUNNER_TEMP/published-proof/reference-analysis-direct-proof.json" --prepare-pages
      - uses: actions/upload-artifact@v4
        with:
          name: revision-diagnostics-proof
          path: /tmp/revision-diagnostics-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/revision-diagnostics-pages
      - name: Recheck latest successful deployment before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-revision-diagnostics-release.mjs "$RUNNER_TEMP/published-proof/reference-analysis-direct-proof.json" --check-published-base
      - name: Publish only authorized Step 3 revision stage diagnostics
        id: deployment
        uses: actions/deploy-pages@v4
