name: Strict Infistar transport release protection
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Original lock result (never reclassified as passed)
        id: original_lock
        continue-on-error: true
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Record historical original lock outcome
        env:
          ORIGINAL_OUTCOME: ${{ steps.original_lock.outcome }}
        run: echo "Original lock outcome = $ORIGINAL_OUTCOME. Required independent acceptance follows separately." >> "$GITHUB_STEP_SUMMARY"
      - name: Required strict independent release acceptance
        run: node scripts/check-infistar-responses-release.mjs
      - name: Independent acceptance adversarial tests
        run: node --test scripts/test-infistar-responses-release.mjs
      - name: Responses transport and existing stream regression
        run: node --test forge/test-infistar-reconstruction-responses.mjs forge/test-infistar-reconstruction-stream.mjs
      - name: Install isolated browser test runtime (no repository dependencies changed)
        run: npm install --prefix "$RUNNER_TEMP/revision-test" playwright@1.58.2 && "$RUNNER_TEMP/revision-test/node_modules/.bin/playwright" install chromium --with-deps
      - name: Revision behavior and pixel preservation regression
        env:
          REVISION_PLAYWRIGHT: ${{ runner.temp }}/revision-test/node_modules/playwright
          REVISION_BUNDLED_BROWSER: '1'
        run: node forge/test-revision-compact.cjs
