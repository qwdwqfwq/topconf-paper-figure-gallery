name: Publish FigureForge footer cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-forge-footer.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record original protection outcome
        id: original_lock
        continue-on-error: true
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Verify the approved footer-only change
        env:
          ORIGINAL_OUTCOME: ${{ steps.original_lock.outcome }}
        run: |
          echo "Original freeze outcome = $ORIGINAL_OUTCOME; only the requested footer presentation may change online; generation and export code stays byte-identical." >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code HEAD^ HEAD -- 'forge/**' ':(exclude)forge/index.html' ':(exclude)forge/i18n_forge.js' .github/forge-workflow-lock.json scripts/check-forge-workflow-lock.mjs .github/workflows/deploy.yml
          node --test scripts/test-forge-footer-release.mjs
      - uses: actions/download-artifact@v4
        with:
          name: gallery-github-proof
          run-id: 45304981743
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-proof
      - name: Verify exact footer deletions and construct identical remaining files
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-forge-footer-release.mjs "$RUNNER_TEMP/published-proof/gallery-github-proof.json" --prepare-pages
      - uses: actions/upload-artifact@v4
        with:
          name: forge-footer-proof
          path: /tmp/forge-footer-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/forge-footer-pages
      - name: Allow uploaded Pages artifact metadata to become available
        run: sleep 30
      - name: Recheck unchanged publication base
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-forge-footer-release.mjs "$RUNNER_TEMP/published-proof/gallery-github-proof.json" --check-published-base
      - name: Publish approved footer cleanup
        id: deployment
        uses: actions/deploy-pages@v4
