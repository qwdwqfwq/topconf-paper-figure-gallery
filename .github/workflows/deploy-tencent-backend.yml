name: Deploy isolated Tencent backend migration
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-tencent-backend.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record original freeze check without changing its baseline
        id: original_lock
        continue-on-error: true
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Report original freeze result and verify unchanged protection
        env:
          ORIGINAL_OUTCOME: ${{ steps.original_lock.outcome }}
        run: |
          echo "Original freeze outcome = $ORIGINAL_OUTCOME; existing guard and baseline remain unchanged." >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code HEAD^ HEAD -- .github/forge-workflow-lock.json scripts/check-forge-workflow-lock.mjs forge/index.html
      - uses: actions/download-artifact@v4
        with:
          name: infistar-reference-hk-proof
          run-id: 44273468049
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-proof
      - name: Verify exact ingress patch and task recovery
        run: node --test scripts/test-tencent-backend-release.mjs forge/test-tencent-network.mjs forge/test-step3-initial-image-job.mjs forge/test-step3-image-protocol.mjs
      - name: Build artifact preserving every other published byte
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-tencent-backend-release.mjs "$RUNNER_TEMP/published-proof/infistar-reference-hk-proof.json" --prepare-pages
      - uses: actions/upload-artifact@v4
        with:
          name: tencent-backend-proof
          path: /tmp/tencent-backend-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/tencent-backend-pages
      - name: Recheck latest successful deployment before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-tencent-backend-release.mjs "$RUNNER_TEMP/published-proof/infistar-reference-hk-proof.json" --check-published-base
      - name: Publish only authorized Tencent network changes
        id: deployment
        uses: actions/deploy-pages@v4
