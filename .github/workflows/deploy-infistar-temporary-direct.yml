name: Deploy temporary Infistar browser-direct routing
on:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-infistar-temporary-direct.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record existing workflow lock result
        id: original_lock
        continue-on-error: true
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Verify original protection remains unchanged
        env:
          ORIGINAL_OUTCOME: ${{ steps.original_lock.outcome }}
        run: |
          echo "Original freeze outcome = $ORIGINAL_OUTCOME; existing guard and baseline remain unchanged." >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code HEAD^ HEAD -- .github/forge-workflow-lock.json scripts/check-forge-workflow-lock.mjs
      - uses: actions/download-artifact@v4
        with:
          name: domain-notice-proof
          run-id: 44330267719
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-proof
      - name: Build scoped routing update preserving unrelated published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-infistar-temporary-direct-release.mjs "$RUNNER_TEMP/published-proof/domain-notice-proof.json" --prepare-pages
      - uses: actions/upload-artifact@v4
        with:
          name: infistar-direct-proof
          path: /tmp/infistar-direct-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/infistar-direct-pages
      - name: Recheck published base
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-infistar-temporary-direct-release.mjs "$RUNNER_TEMP/published-proof/domain-notice-proof.json" --check-published-base
      - name: Publish temporary Infistar direct routing
        id: deployment
        uses: actions/deploy-pages@v4
