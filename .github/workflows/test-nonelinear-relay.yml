name: Test NoneLinear relay

on:
  push:
    paths:
      - 'nonelinear-relay/**'
      - '.github/workflows/test-nonelinear-relay.yml'
  pull_request:
    paths:
      - 'nonelinear-relay/**'
      - '.github/workflows/test-nonelinear-relay.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node nonelinear-relay/test-worker.mjs
      - run: node nonelinear-relay/test-references.mjs
      - run: node scripts/check-forge-workflow-lock.mjs
