name: Deploy isolated revision update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Original lock result (historical failures remain failures)
        id: original_lock
        continue-on-error: true
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Record original lock outcome explicitly
        env:
          ORIGINAL_OUTCOME: ${{ steps.original_lock.outcome }}
        run: echo "Original lock outcome = $ORIGINAL_OUTCOME. Independent revision acceptance does not change this result." >> "$GITHUB_STEP_SUMMARY"
      - name: Strict isolated release acceptance and artifact construction
        run: node scripts/check-revision-isolated-release.mjs --prepare-pages
      - name: Independent acceptance adversarial tests
        run: node --test scripts/test-revision-isolated-release.mjs
      - name: Install isolated revision browser test runtime
        run: npm install --prefix "$RUNNER_TEMP/revision-test" playwright@1.58.2 && "$RUNNER_TEMP/revision-test/node_modules/.bin/playwright" install chromium --with-deps
      - name: Required revision behavior and pixel preservation regression
        env:
          REVISION_PLAYWRIGHT: ${{ runner.temp }}/revision-test/node_modules/playwright
          REVISION_BUNDLED_BROWSER: '1'
        run: node forge/test-revision-compact.cjs
      - name: Preserve existing bitmap regression checks
        run: node --test forge/test-openai-token-limit.mjs forge/test-bitmap-composition.mjs forge/test-generation-intent.mjs
      - name: Preserve existing SVG regression checks
        run: node --test forge/test-svg-chat-response.mjs nonelinear-relay/test-chat-stream.mjs nonelinear-relay/test-worker.mjs nonelinear-relay/test-live-chat.mjs nonelinear-relay/test-source-image.mjs nonelinear-relay/test-references.mjs
      - name: Preserve existing retrieval regression checks
        run: node --test forge/test-retrieval-boot.mjs
      - name: Preserve existing PDF regression checks
        run: node --test forge/test-chat-api.mjs forge/test-openai-pdf.mjs nonelinear-relay/test-worker.mjs nonelinear-relay/test-references.mjs nonelinear-relay/test-source-image.mjs nonelinear-relay/test-chat-stream.mjs forge/test-infistar-reconstruction-stream.mjs nonelinear-relay/test-live-chat.mjs
      - name: Preserve existing editable export regression checks
        run: node forge/test-editable-export.mjs
      - name: Upload independent byte preservation proof
        uses: actions/upload-artifact@v4
        with:
          name: isolated-revision-proof
          path: /tmp/isolated-revision-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/isolated-revision-pages
      - name: Deploy isolated artifact to current application
        id: deployment
        uses: actions/deploy-pages@v4
