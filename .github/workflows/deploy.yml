name: Deploy isolated author contact link
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Original lock result (historical failures remain failures)
        id: original_lock
        continue-on-error: true
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Record original lock outcome
        env:
          ORIGINAL_OUTCOME: ${{ steps.original_lock.outcome }}
        run: echo "Original lock outcome = $ORIGINAL_OUTCOME. Contact publication preserves all preexisting application bytes." >> "$GITHUB_STEP_SUMMARY"
      - name: Download successful current publication proof
        uses: actions/download-artifact@v4
        with:
          name: step3-preflight-proof
          run-id: 43859330805
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/author-contact-base
      - name: Verify exact contact additions and preserve all other published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-author-contact-release.mjs "$RUNNER_TEMP/author-contact-base/step3-preflight-proof.json" --prepare-pages
      - name: Upload byte preservation proof
        uses: actions/upload-artifact@v4
        with:
          name: author-contact-proof
          path: /tmp/author-contact-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/author-contact-pages
      - name: Publish author contact UI
        id: deployment
        uses: actions/deploy-pages@v4
