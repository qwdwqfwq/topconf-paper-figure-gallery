name: Deploy isolated Step 3 job recovery
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Original lock result (historical failures remain failures)
        id: original_lock
        continue-on-error: true
        run: node scripts/check-forge-workflow-lock.mjs
      - name: Record original lock outcome explicitly
        env:
          ORIGINAL_OUTCOME: ${{ steps.original_lock.outcome }}
        run: echo "Original lock outcome = $ORIGINAL_OUTCOME. Independent Step 3 acceptance does not change this result." >> "$GITHUB_STEP_SUMMARY"
      - name: Download current recovery publication base
        uses: actions/download-artifact@v4
        with:
          name: step3-analysis-proof
          run-id: 43907732087
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/step3-recovery-base
      - name: Strict isolated recovery acceptance and artifact construction
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-step3-recovery-release.mjs "$RUNNER_TEMP/step3-recovery-base/step3-analysis-proof.json" --prepare-pages
      - name: Download historical analysis acceptance input
        uses: actions/download-artifact@v4
        with:
          name: step3-international-proof
          run-id: 43869741849
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/step3-analysis-base
      - name: Preserve published analysis acceptance and adversarial tests
        run: |
          historical="$RUNNER_TEMP/analysis-acceptance-history"
          trap 'git worktree remove --force "$historical"' EXIT
          git worktree add --detach "$historical" 1aa0f3940cc1cf81747d6e2b9559dabe5da1d688
          (cd "$historical" && node scripts/check-step3-analysis-release.mjs "$RUNNER_TEMP/step3-analysis-base/step3-international-proof.json" && node --test scripts/test-step3-analysis-release.mjs)
      - name: Durable backend recovery and local revision regression
        run: node --test infistar-image-relay/test-worker.mjs forge/test-revision-job-recovery.mjs scripts/test-step3-recovery-release.mjs
      - name: Download historical international acceptance input
        uses: actions/download-artifact@v4
        with:
          name: step3-initial-read-proof
          run-id: 43864925489
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/step3-international-base
      - name: Preserve published international acceptance and adversarial tests
        run: |
          historical="$RUNNER_TEMP/international-acceptance-history"
          trap 'git worktree remove --force "$historical"' EXIT
          git worktree add --detach "$historical" 5f1ea4acd3e417a1545b06af9f6e9ad90a11f1b2
          (cd "$historical" && node scripts/check-step3-international-release.mjs "$RUNNER_TEMP/step3-international-base/step3-initial-read-proof.json" && node --test scripts/test-step3-international-release.mjs)
      - name: Download historical initial-read acceptance input
        uses: actions/download-artifact@v4
        with:
          name: author-contact-proof
          run-id: 43864466485
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/initial-read-history-base
      - name: Preserve published initial-read acceptance and adversarial tests
        run: |
          historical="$RUNNER_TEMP/initial-read-acceptance-history"
          trap 'git worktree remove --force "$historical"' EXIT
          git worktree add --detach "$historical" e6cbac0ce9776114cce12689c0866358582624c3
          (cd "$historical" && node scripts/check-step3-initial-read-release.mjs "$RUNNER_TEMP/initial-read-history-base/author-contact-proof.json" && node --test scripts/test-step3-initial-read-release.mjs)
      - name: Download historical author contact acceptance input
        uses: actions/download-artifact@v4
        with:
          name: step3-preflight-proof
          run-id: 43859330805
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/author-contact-history-base
      - name: Preserve published author contact acceptance
        run: |
          historical="$RUNNER_TEMP/contact-acceptance-history"
          trap 'git worktree remove --force "$historical"' EXIT
          git worktree add --detach "$historical" 874360027896ad0d0d99a9b0ced5a11653b17ae4
          (cd "$historical" && node scripts/check-author-contact-release.mjs "$RUNNER_TEMP/author-contact-history-base/step3-preflight-proof.json")
      - name: Download historical preflight acceptance input
        uses: actions/download-artifact@v4
        with:
          name: step3-task-diagnostics-proof
          run-id: 43723203769
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/step3-preflight-history-base
      - name: Preserve previous preflight acceptance and adversarial tests
        run: |
          historical="$RUNNER_TEMP/preflight-acceptance-history"
          trap 'git worktree remove --force "$historical"' EXIT
          git worktree add --detach "$historical" 51e7b351fdd7061f3ab5aa9b24b004cf207be54f
          (cd "$historical" && node scripts/check-step3-preflight-release.mjs "$RUNNER_TEMP/step3-preflight-history-base/step3-task-diagnostics-proof.json" && node --test scripts/test-step3-preflight-release.mjs)
      - name: Step 3 stream protocol regression
        run: node --test forge/test-step3-initial-image-job.mjs forge/test-step3-image-stream.mjs forge/test-revision-error-recovery.mjs
      - name: Independent acceptance adversarial tests
        run: node --test forge/test-step3-analysis-request.mjs forge/test-step3-analysis-scope.mjs forge/test-step3-international-image-route.mjs forge/test-step3-nonelinear-dimensions.mjs forge/test-step3-nano-banana-ordinary.mjs forge/test-step3-image-protocol.mjs forge/test-revision-routing.mjs forge/test-nonelinear-source.mjs nonelinear-relay/test-source-image.mjs
      - name: Preserve existing Responses transport regression
        run: node --test forge/test-infistar-reconstruction-responses.mjs forge/test-infistar-reconstruction-stream.mjs
      - name: Install isolated revision browser test runtime
        run: npm install --prefix "$RUNNER_TEMP/revision-test" playwright@1.58.2 && "$RUNNER_TEMP/revision-test/node_modules/.bin/playwright" install chromium --with-deps
      - name: Required revision behavior and pixel preservation regression
        env:
          REVISION_PLAYWRIGHT: ${{ runner.temp }}/revision-test/node_modules/playwright
          REVISION_BUNDLED_BROWSER: '1'
        run: |
          node forge/test-step3-analysis-browser.cjs
          node forge/test-revision-compact.cjs
          node forge/test-step3-preflight-jobs-browser.cjs
          node forge/test-manual-revision-browser.cjs
          historical="$RUNNER_TEMP/preflight-browser-history"
          trap 'git worktree remove --force "$historical"' EXIT
          git worktree add --detach "$historical" a72641224b23164fbf3142feb9e2428e99c61018
          (cd "$historical" && node forge/test-step3-image-stream-browser.cjs && node forge/test-nonelinear-source-browser.cjs)
          git -C "$historical" checkout --detach ac4d5b6fcd88d110ae5f1453c9857bcb31438211
          (cd "$historical" && node forge/test-revision-context.cjs)
          git -C "$historical" checkout --detach 661d2648bdc4efc0b49772243340dcb4e2704789
          (cd "$historical" && node forge/test-revision-auto-ui.cjs)
      - name: Preserve existing bitmap regression checks
        run: node --test forge/test-openai-token-limit.mjs forge/test-bitmap-composition.mjs forge/test-generation-intent.mjs
      - name: Preserve existing SVG regression checks
        run: node --test forge/test-svg-chat-response.mjs nonelinear-relay/test-chat-stream.mjs nonelinear-relay/test-worker.mjs nonelinear-relay/test-live-chat.mjs nonelinear-relay/test-source-image.mjs nonelinear-relay/test-references.mjs
      - name: Preserve existing retrieval regression checks
        run: node --test forge/test-retrieval-boot.mjs
      - name: Preserve existing PDF regression checks
        run: node --test forge/test-chat-api.mjs forge/test-openai-pdf.mjs nonelinear-relay/test-worker.mjs nonelinear-relay/test-references.mjs nonelinear-relay/test-source-image.mjs nonelinear-relay/test-chat-stream.mjs forge/test-infistar-reconstruction-stream.mjs nonelinear-relay/test-live-chat.mjs
      - name: Preserve existing editable export regression checks
        run: node forge/test-editable-export.mjs
      - name: Upload independent byte preservation proof
        uses: actions/upload-artifact@v4
        with:
          name: step3-recovery-proof
          path: /tmp/step3-recovery-proof.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/step3-recovery-pages
      - name: Deploy isolated artifact to current application
        id: deployment
        uses: actions/deploy-pages@v4
