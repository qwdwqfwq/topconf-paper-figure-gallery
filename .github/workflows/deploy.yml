name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the CI-only follow-up
        id: ci_only
        shell: bash
        run: |
          approved=c8f26bc17383a60ddb23be0f2665dfa539990cf9
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/main ||
                "$(git show -s --format=%P HEAD)" != "$approved" ]]; then
            exit 0
          fi

          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          expected_paths=$(printf '%s\n' .github/workflows/deploy.yml .github/workflows/forge-workflow-lock.yml)
          test "$(git diff --name-only --no-renames "$approved" HEAD)" = "$expected_paths"
          test -z "$(git status --porcelain --untracked-files=all)"

          echo "Site content matches the approved release $approved. Skipping repeat publication."
          echo "skip=true" >> "$GITHUB_OUTPUT"
      - name: Verify bitmap composition regression tests
        if: steps.ci_only.outputs.skip != 'true'
        run: node --test forge/test-bitmap-composition.mjs forge/test-generation-intent.mjs
      - name: Verify SVG completion regression tests
        if: steps.ci_only.outputs.skip != 'true'
        run: node --test forge/test-svg-chat-response.mjs nonelinear-relay/test-chat-stream.mjs nonelinear-relay/test-worker.mjs nonelinear-relay/test-live-chat.mjs nonelinear-relay/test-source-image.mjs nonelinear-relay/test-references.mjs
      - name: Verify FigureForge workflow lock
        if: steps.ci_only.outputs.skip != 'true'
        run: node scripts/check-step3-svg-recovery-release-20261112.mjs --prepare-pages || node scripts/check-forge-workflow-lock.mjs || node scripts/check-pdf-release-exception-20261028.mjs || node scripts/check-nonelinear-source-release-20261031.mjs || node scripts/check-infistar-step4-release-20261031.mjs || node scripts/check-nonelinear-step4-stream-release-20261031.mjs || node scripts/check-retrieval-boot-release-20261031.mjs || node scripts/check-analytics-release.mjs || node scripts/check-tutorial-video-release-20261104.mjs || node scripts/check-support-author-release-20261104.mjs || node scripts/check-tutorial-cover-release-20261107.mjs || node scripts/check-gallery-summary-release-20261109.mjs --prepare-pages || node scripts/check-step4-temperature-release-20261109.mjs --prepare-pages || node scripts/check-gallery-home-copy-release-20261110.mjs --prepare-pages || node scripts/check-forge-provider-release-20261110.mjs --prepare-pages || node scripts/check-nonelinear-sponsor-release-20261111.mjs --prepare-pages || node scripts/check-nonelinear-links-release-20261111.mjs --prepare-pages || node scripts/check-nonelinear-recommended-release-20261111.mjs --prepare-pages || node scripts/check-nonelinear-offer-copy-release-20261111.mjs --prepare-pages || node scripts/check-revision-release-20261112.mjs --prepare-pages || node scripts/check-revision-attachments-release-20261112.mjs --prepare-pages || node scripts/check-revision-delete-release-20261112.mjs --prepare-pages || node scripts/check-revision-edit-release-20261112.mjs --prepare-pages || node scripts/check-svg-revision-release-20261112.mjs --prepare-pages || node scripts/check-svg-history-release-20261112.mjs --prepare-pages || node scripts/check-revision-hint-release-20261112.mjs --prepare-pages || node scripts/check-revision-gemini-release-20261112.mjs --prepare-pages || node scripts/check-revision-general-release-20261112.mjs --prepare-pages || node scripts/check-english-banner-release-20261112.mjs --prepare-pages || node scripts/check-nonelinear-svg-completion-release-20261112.mjs --prepare-pages || node scripts/check-bitmap-recommend-copy-release-20261112.mjs --prepare-pages || node scripts/check-bitmap-composition-release-20261112.mjs --prepare-pages || node scripts/check-bitmap-internal-coordinates-release-20261112.mjs --prepare-pages || node scripts/check-step1-pdf-submit-release-20261112.mjs --prepare-pages || node scripts/check-revision-upload-layout-release-20261112.mjs --prepare-pages
      - name: Verify retrieval initialization regression tests
        if: steps.ci_only.outputs.skip != 'true'
        run: node --test forge/test-retrieval-boot.mjs
      - name: Verify PDF parsing regression tests
        if: steps.ci_only.outputs.skip != 'true'
        run: node --test forge/test-chat-api.mjs forge/test-openai-pdf.mjs nonelinear-relay/test-worker.mjs nonelinear-relay/test-references.mjs nonelinear-relay/test-source-image.mjs nonelinear-relay/test-chat-stream.mjs forge/test-infistar-reconstruction-stream.mjs nonelinear-relay/test-live-chat.mjs
      - name: Verify editable export regression tests
        if: steps.ci_only.outputs.skip != 'true'
        run: node forge/test-editable-export.mjs
      - name: Setup Pages
        if: steps.ci_only.outputs.skip != 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.ci_only.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        if: steps.ci_only.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
