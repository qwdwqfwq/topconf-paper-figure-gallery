<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>支持作者 · 顶会主图画廊</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8f9ff;color:#20233b;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.75}a{color:#4f46e5;text-underline-offset:4px}header{max-width:1056px;margin:auto;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:700;text-decoration:none;color:#292642}.brand span{color:#6559df;margin-right:10px}header>a:last-child{font-size:14px}main{max-width:1056px;margin:36px auto 64px;padding:0 32px}.card{display:grid;grid-template-columns:1fr 390px;gap:48px;background:white;border:1px solid #e9e8f4;border-radius:24px;padding:48px;box-shadow:0 16px 64px #29264206}.intro{padding-top:32px}.eyebrow{color:#6559df;font-size:14px;font-weight:600}h1{font-size:36px;line-height:1.4;letter-spacing:-1px;margin:18px 0 24px}p{color:#65677b;margin:0 0 18px}.note{margin-top:36px;padding-top:24px;border-top:1px solid #efedf6;font-size:14px}.payment{text-align:center;background:#f7f8fc;border-radius:18px;padding:20px}.payment h2{font-size:17px;margin:0 0 14px}.payment img{display:block;width:100%;height:auto;border-radius:10px}.actions{display:flex;justify-content:center;gap:24px;margin:16px 0 8px;font-size:14px}.hint{font-size:12px;margin:0;color:#777a8c}footer{text-align:center;color:#8a8c9d;font-size:13px;margin-top:24px}@media(max-width:850px){.card{gap:28px;padding:28px;grid-template-columns:1fr 330px}.intro{padding-top:8px}h1{font-size:30px}}@media(max-width:680px){header{padding:20px}main{margin:12px auto 32px;padding:0 16px}.card{grid-template-columns:1fr;padding:24px;gap:24px;border-radius:18px}.intro{padding-top:0}h1{font-size:29px;margin:12px 0 18px}.note{margin-top:20px;padding-top:18px}.payment{width:100%;max-width:390px;justify-self:center;padding:16px}header>a:last-child{white-space:nowrap}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="https://qwdwqfwq.github.io/topconf-paper-figure-gallery/"><span>▧</span>顶会主图画廊</a>
    <a href="https://qwdwqfwq.github.io/topconf-paper-figure-gallery/">返回画廊 ↗</a>
  </header>
  <main>
    <section class="card" aria-labelledby="support-title">
      <div class="intro">
        <div class="eyebrow">支持作者 · Support the creator</div>
        <h1 id="support-title">请作者喝杯咖啡 ☕</h1>
        <p>如果这个画廊帮你找到了论文配图灵感，欢迎随意支持，帮助我持续整理主图、更新数据和维护工具。</p>
        <p>感谢你的支持，Star、分享和反馈也同样重要。</p>
        <p class="note">打赏完全自愿，金额随意。<br>也欢迎通过 GitHub Star、分享画廊或反馈建议来支持这个项目。</p>
      </div>
      <div class="payment">
        <h2>微信扫码支持</h2>
        <a href="assets/wechat-pay.jpg" target="_blank" rel="noopener" aria-label="打开微信收款码原图"><img src="assets/wechat-pay.jpg" alt="作者提供的微信收款码，扫码前请在微信中核对收款人" width="1308" height="1781"></a>
        <div class="actions"><a href="assets/wechat-pay.jpg" target="_blank" rel="noopener">查看原图 ↗</a><a href="assets/wechat-pay.jpg" download="画廊作者-微信收款码.jpg">保存收款码</a></div>
        <p class="hint">手机浏览可保存图片，再在微信扫一扫中从相册选择。</p>
      </div>
    </section>
    <footer>感谢你的使用与支持。</footer>
  </main>
</body>
</html>
