<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FigureForge · 画廊检索画自己的主图</title>
<style>
  :root{
    --indigo:#4f46e5; --indigo-soft:#eef2ff; --green:#059669; --green-soft:#ecfdf5;
    --purple:#7c3aed; --purple-soft:#f5f3ff; --orange:#ea580c; --orange-soft:#fff7ed;
    --red:#dc2626; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f6f7fb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
  .wrap{max-width:1260px;margin:0 auto;padding:18px 20px 60px}
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#8b5cf6);
        display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 6px 16px rgba(79,70,229,.28)}
  h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:13px}
  .pill{margin-left:auto;font-size:12px;color:#065f46;background:#d1fae5;border:1px solid #a7f3d0;
        padding:5px 11px;border-radius:999px;font-weight:600}
  .card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px;
        box-shadow:0 1px 2px rgba(17,24,39,.04)}
  .step{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:750;margin-bottom:13px}
  .num{width:24px;height:24px;border-radius:8px;background:var(--indigo);color:#fff;display:grid;
       place-items:center;font-size:13px;font-weight:800}
  textarea{width:100%;min-height:118px;border:1px solid var(--line);border-radius:11px;padding:12px 13px;
           font:inherit;resize:vertical;background:#fcfcfd;outline:none}
  textarea:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.13)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .field{display:flex;align-items:center;gap:7px;background:#f9fafb;border:1px solid var(--line);
         border-radius:10px;padding:6px 10px}
  .field label{font-size:12px;font-weight:700;color:#374151}
  select{border:0;background:transparent;font:inherit;font-size:13px;outline:none;cursor:pointer;color:#1f2937;max-width:240px}
  .f-venue label{color:var(--indigo)} .f-year label{color:var(--green)}
  .f-tier label{color:var(--purple)} .f-pattern label{color:var(--orange)}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px}
  .btn-primary{background:var(--indigo);color:#fff;font-weight:700;padding:10px 22px;box-shadow:0 4px 12px rgba(79,70,229,.25)}
  .btn-primary:disabled{background:#a5b4fc;box-shadow:none;cursor:not-allowed}
  .btn-ghost{background:#f3f4f6;color:#374151;font-weight:600;padding:9px 15px}
  .btn-mini{background:#eef2ff;color:#4338ca;font-weight:700;padding:6px 12px;font-size:12.5px}
  .btn-tiny{background:transparent;color:var(--muted);font-weight:600;font-size:12px;padding:4px 8px;text-decoration:underline}
  .hint{color:var(--muted);font-size:12.5px;margin-top:10px}
  /* compact parse status + meta line (step 1) */
  .status-line{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.5;color:#475569;
    background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;overflow-wrap:anywhere}
  .status-line::before{content:"";flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:#94a3b8;margin-top:5px}
  .status-line[data-state="loading"]{color:#3730a3;background:#f5f6ff;border-color:#dfe3ff}
  .status-line[data-state="loading"]::before{background:var(--indigo);animation:parsePulse 1.4s ease-in-out infinite}
  .status-line[data-state="success"]{color:#065f46;background:#f0fdf7;border-color:#bbf7d0}
  .status-line[data-state="success"]::before{background:#10b981}
  .status-line[data-state="error"]{color:#991b1b;background:#fef2f2;border-color:#fecaca}
  .status-line[data-state="error"]::before{background:#dc2626}
  .meta-line{margin:7px 1px 0;font-size:11.5px;color:#64748b;overflow-wrap:anywhere}
  .meta-line.warn{color:#dc2626;font-weight:800}
  .bnote.err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:9px;
    padding:7px 10px;margin-top:8px;font-weight:600;font-size:11.5px}
  .bnote.warn-inline{color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:9px;
    padding:7px 10px;margin-top:8px;font-size:11.5px}
  .pdf-upload-btn{display:inline-flex;align-items:center;gap:11px;padding:11px 19px 11px 12px;max-width:100%;
    border:1px solid #c4b5fd;border-radius:22px;background:linear-gradient(145deg,#8b5cf6,#4f46e5);color:#fff;
    box-shadow:0 6px 0 #3730a3,0 10px 22px #6366f133,inset 0 2px 0 #ffffff66;
    transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .25s;transform-origin:center}
  .pdf-upload-icon{display:grid;place-items:center;width:38px;height:42px;flex-shrink:0;border-radius:12px;background:#ffffff24;
    border:1px solid #ffffff66;font-size:11px;font-weight:850;box-shadow:inset 0 1px 2px #ffffff44}
  .pdf-upload-copy{text-align:left;display:grid;gap:1px}
  .pdf-upload-copy strong{font-size:15px;font-weight:800}.pdf-upload-copy small{font-size:11px;color:#ede9fe;font-weight:400}
  .pdf-upload-arrow{font-size:20px;margin-left:7px}
  .pdf-upload-btn:hover:not(:disabled){transform:translateY(-2px) scale(1.025);box-shadow:0 8px 0 #3730a3,0 14px 26px #6366f140,inset 0 2px 0 #ffffff66}
  .pdf-upload-btn:active:not(:disabled){transform:translateY(5px) scale(.96, .94);box-shadow:0 1px 0 #3730a3,0 3px 8px #6366f126;transition-duration:.09s}
  .pdf-upload-btn:focus-visible{outline:3px solid #a78bfa;outline-offset:6px}
  .pdf-upload-btn:disabled{cursor:wait;background:linear-gradient(145deg,#7c6bb7,#6359a0);box-shadow:0 3px 0 #4c4381,inset 0 2px 0 #ffffff44}
  @keyframes parsePulse{50%{opacity:.5}}
  @media(prefers-reduced-motion:reduce){.pdf-upload-btn{transition:none}.pdf-upload-btn:hover:not(:disabled),.pdf-upload-btn:active:not(:disabled){transform:none}.status-line[data-state="loading"]::before{animation:none}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(226px,1fr));gap:14px}
  .rc{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;position:relative;
      transition:transform .12s, box-shadow .12s, border-color .12s;cursor:pointer}
  .rc:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(17,24,39,.1)}
  .rc:focus-visible{outline:3px solid rgba(79,70,229,.55);outline-offset:2px}
  .rc.sel{border-color:var(--indigo);box-shadow:0 0 0 2px rgba(79,70,229,.35)}
  .rc .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#f3f4f6;display:block;cursor:pointer}
  .pick{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.94);border:1px solid var(--line);
        border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700;color:#374151}
  .rc.sel .pick{background:var(--indigo);color:#fff;border-color:var(--indigo)}
  .score{position:absolute;top:8px;right:8px;background:rgba(17,24,39,.72);color:#fff;font-size:11px;
         border-radius:7px;padding:2px 7px;font-weight:600}
  .rc .body{padding:10px 11px 11px}
  .rc h3{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
         -webkit-box-orient:vertical;overflow:hidden;min-height:36px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
  .c-venue{background:var(--indigo-soft);color:var(--indigo)}
  .c-year{background:var(--green-soft);color:var(--green)}
  .c-pattern{background:var(--orange-soft);color:var(--orange)}
  .c-oral{background:linear-gradient(90deg,#f59e0b,#d97706);color:#fff}
  .c-spot{background:linear-gradient(90deg,#94a3b8,#64748b);color:#fff}
  .c-best{background:linear-gradient(90deg,#ef4444,#b91c1c);color:#fff}
  .c-hm{background:#dbeafe;color:#1d4ed8}
  .refs-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:13px}
  .refmini{display:flex;gap:8px;align-items:center;background:#f9fafb;border:1px solid var(--line);
           border-radius:10px;padding:6px 10px 6px 6px;font-size:12px;max-width:340px}
  .refmini img{width:52px;height:39px;object-fit:cover;border-radius:7px}
  .refmini b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .refmini span{color:var(--muted)}
  .refmini .x{margin-left:4px;color:#9ca3af;cursor:pointer;font-weight:700}
  .rc-actions{display:flex;gap:7px;margin-top:10px}
  .rc-action{flex:1;border:1px solid #c7d2fe;background:#fff;color:var(--indigo);border-radius:8px;padding:6px 8px;font-size:12px;font-weight:700;text-align:center;text-decoration:none}
  .rc-action:hover{background:var(--indigo-soft)}
  .forge-lightbox{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(15,23,42,.72);animation:fadeIn .18s ease}
  .forge-lightbox[hidden]{display:none}
  .forge-lb-dialog{position:relative;width:min(1080px,96vw);max-height:94vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 24px 80px rgba(0,0,0,.35);animation:lbIn .24s cubic-bezier(.2,.8,.2,1)}
  .forge-lb-dialog img{display:block;width:100%;max-height:72vh;object-fit:contain;background:#f3f4f6;border-radius:10px}
  .forge-lb-close{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(17,24,39,.72);color:#fff;font-size:24px;line-height:1;z-index:2}
  .forge-lb-nav{position:fixed;top:50%;transform:translateY(-50%);width:42px;height:58px;border-radius:12px;background:rgba(255,255,255,.9);color:var(--indigo);font-size:30px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .forge-lb-nav.prev{left:18px}.forge-lb-nav.next{right:18px}.forge-lb-nav:disabled{opacity:.35;cursor:not-allowed}
  .forge-lb-meta{padding:12px 4px 2px}.forge-lb-meta h2{font-size:16px;line-height:1.4}.forge-lb-meta p{color:var(--muted);font-size:12px;margin-top:4px}
  .forge-lb-links{display:flex;gap:8px;margin-top:9px}.forge-lb-links a{color:var(--indigo);font-weight:700;font-size:12px;text-decoration:none}
  @keyframes lbIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
  @keyframes lbSwapNext{from{opacity:.25;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes lbSwapPrev{from{opacity:.25;transform:translateX(-28px)}to{opacity:1;transform:none}}
  .forge-lb-dialog.swap-next img{animation:lbSwapNext .22s ease}.forge-lb-dialog.swap-prev img{animation:lbSwapPrev .22s ease}
  @media (prefers-reduced-motion:reduce){.forge-lightbox,.forge-lb-dialog,.forge-lb-dialog.swap-next img,.forge-lb-dialog.swap-prev img{animation:none}}
  details.settings{border:1px dashed var(--line);border-radius:11px;padding:10px 13px;margin-bottom:13px;background:#fcfcfd}
  summary{cursor:pointer;font-weight:700;font-size:13px;color:#374151}
  .settings .srow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:11px}
  .sbox{display:flex;flex-direction:column;gap:4px}
  .sbox > span{font-size:11.5px;font-weight:700;color:#6b7280}
  input[type=text],input[type=password]{border:1px solid var(--line);border-radius:9px;padding:9px 11px;
        font:inherit;font-size:13px;outline:none;background:#fff;min-width:0}
  input:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
  #provider{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:#fff;max-width:none}
  #target{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:#fff;max-width:none;flex:1;min-width:0}
  #model{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:#fff;max-width:none;flex:1;min-width:260px}
  #parseModel,#parseCustomModel,#contentMode,#baseOverride,#customModel{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;background:#fff;color:#1f2937;max-width:none;flex:1;min-width:0;outline:none}
  #contentQuery{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;background:#fff;max-width:none;flex:1;min-width:0;outline:none}
  #parseModel:focus,#parseCustomModel:focus,#contentMode:focus,#contentQuery:focus,#baseOverride:focus,#customModel:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(99,102,241,.1)}
  #model optgroup{font-weight:700;color:#374151}
  .tabs{display:inline-flex;background:#f3f4f6;border-radius:10px;padding:3px;gap:2px}
  .tabs button{padding:7px 15px;font-size:13px;font-weight:650;color:#4b5563;background:transparent}
  .tabs button.on{background:#fff;color:var(--indigo);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  #out{margin-top:15px;border:1px solid var(--line);border-radius:13px;padding:14px;min-height:80px;
       background:#fbfbfd;display:none}
  #out iframe{width:100%;min-height:560px;border:0;border-radius:8px;background:#fff}
  #out img{max-width:100%;border-radius:8px;display:block;margin:0 auto}
  .dl{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .err{color:var(--red);font-weight:600}
  .errlist{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;
           padding:9px 12px;margin-top:12px;font-size:13px}
  .errlist div{margin:2px 0 2px 16px}
  .guide{font-size:13px;color:#374151}
  .guide li{margin:6px 0 6px 18px}
  .guide b{color:var(--ink)}
  .empty-note{color:var(--muted);text-align:center;padding:34px 0}
  .spin{color:var(--muted);padding:20px 0;text-align:center}
  .spin.big::before{content:"";display:inline-block;width:16px;height:16px;border:2px solid #c7d2fe;border-top-color:var(--indigo);
        border-radius:50%;margin-right:9px;vertical-align:-3px;animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  #bootBanner{background:#eef2ff;border:1px solid #c7d2fe;color:#3730a3;border-radius:11px;
              padding:9px 13px;margin-bottom:14px;font-size:13px;font-weight:600}
  .corsnote{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:9px;
            padding:8px 11px;margin-top:10px;font-size:12.5px}
  .chkline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#4b5563;margin-top:10px}
  .lang-toggle{font-size:12px;font-weight:700;color:#4f46e5;background:#fff;border:1px solid var(--line);
        border-radius:999px;padding:5px 13px;margin-left:auto}
  .lang-toggle:hover{border-color:#4f46e5}
  @media(max-width:640px){.lang-toggle{margin-left:0}}

  /* ===== step 1: boxed two-column layout ===== */
  .step-note{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:2px}
  .s1-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px;align-items:start}
  .s1-col{display:grid;gap:13px;min-width:0}
  @media(max-width:960px){.s1-grid{grid-template-columns:minmax(0,1fr)}}
  .box{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:#fbfbfd;min-width:0}
  .box h4{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:#1f2937;margin-bottom:11px}
  .box h4 .bi{font-size:14px;line-height:1}
  .box h4 small{font-weight:600;font-size:11px;color:var(--muted)}
  .box h4 small:not(:first-child){margin-left:auto;font-weight:600}
  .b-indigo{background:#f7f8ff;border-color:#dde2ff}
  .b-indigo h4{color:#4338ca}
  .b-green{background:#f5fdf9;border-color:#cdeee1}
  .b-green h4{color:#047857}
  .b-purple{background:#faf8ff;border-color:#e2dbff}
  .b-purple h4{color:#6d28d9}
  .b-amber{background:#fffcf5;border-color:#f4e4ca}
  .b-amber h4{color:#b45309}
  .b-slate{background:#f7f9fc;border-color:#dfe6ef}
  .b-slate h4{color:#334155}
  .bfield{display:flex;align-items:center;gap:9px;margin-bottom:9px;min-width:0}
  .bfield:last-child{margin-bottom:0}
  .blab{font-size:12px;font-weight:700;color:#4b5563;white-space:nowrap;min-width:86px}
  .bfield input[type=text],.bfield input[type=password]{flex:1;min-width:0;padding:8px 10px;border-radius:9px}
  .bnote{font-size:11.5px;line-height:1.55;color:#6b7280;margin-top:6px;overflow-wrap:anywhere}
  .bnote.tiny{font-size:11px;color:#9ca3af;margin-top:7px}
  .bnote .warn-txt{color:#dc2626;font-weight:700}
  .box .chkline{margin-top:9px}
  .box .corsnote{margin-top:9px}
  .btn-sm{padding:7px 12px;font-size:12.5px;white-space:nowrap}
  .filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .filters .btn-primary{margin-left:auto}
  .ex-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
  .ex-row > span:first-child{font-size:12.5px;color:var(--muted)}
  @media(max-width:720px){.filters .btn-primary{margin-left:0;width:100%}}

  /* ===== steps 2 & 3 share the step-1 box language ===== */
  /* The picker scrolls inside its own box: the page itself stays short, so
     Step 3 is one flick away while every figure remains browsable. */
  #gridBox{padding:13px;max-height:min(70vh,760px);overflow-y:auto;overscroll-behavior:contain;
    scrollbar-gutter:stable;scroll-behavior:auto}
  #gridBox .empty-note{padding:26px 0}
  .grid-more{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 0 4px;font-size:12.5px;color:var(--muted)}
  .grid-end{text-align:center;padding:13px 0 3px;font-size:12px;color:#9ca3af}
  .box .refs-strip{margin-bottom:0}
  .box .pass-tabs{background:#fff;border:1px solid #dfe3ff}
  .box .pass-tabs button.on{background:var(--indigo);color:#fff;box-shadow:0 3px 8px rgba(79,70,229,.22)}
  .box .pass-tabs button.on .subtag{color:#dfe3ff}
  .box .tabs{background:#fff;border:1px solid #e2dbff}
  .box .tabs button.on{background:var(--indigo);color:#fff;box-shadow:0 3px 8px rgba(79,70,229,.22)}
  .box .stepper{margin:12px 0 4px}
  .box .analyze-box{margin-bottom:0}
  .box .srow{margin-top:0}
  .gen-row{display:flex;justify-content:center;margin-top:15px}
  .gen-row .btn-primary{padding:11px 32px;font-size:14px}
  .guide{padding:2px 0}
  .box .guide li{margin:7px 0 7px 18px}
  @media(max-width:640px){
    .box .tabs,.box .pass-tabs{display:flex;flex-wrap:wrap;width:100%}
    .box .tabs button,.box .pass-tabs button{flex:1 1 46%;min-width:0}
    .bfield{flex-wrap:wrap}
    .blab{min-width:0}
    .bfield select,.bfield input[type=text],.bfield input[type=password],#key{flex:1 1 100%}
    .filters{width:100%}
    .field{flex:1 1 auto;justify-content:space-between}
  }

  /* ===== two-stage pipeline ===== */
  .pass-tabs{display:inline-flex;background:#f3f4f6;border-radius:11px;padding:3px;gap:2px;margin-bottom:4px}
  .pass-tabs button{padding:8px 17px;font-size:13px;font-weight:650;color:#4b5563;background:transparent;border-radius:9px;transition:all .18s}
  .pass-tabs button .subtag{display:block;font-size:10.5px;font-weight:500;color:#9ca3af}
  .pass-tabs button.on{background:#fff;color:var(--indigo);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .pass-tabs button.on .subtag{color:#818cf8}
  .stepper{display:flex;align-items:flex-start;margin:4px 0 16px}
  .stp{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:2}
  .stp .ball{width:30px;height:30px;border-radius:50%;background:#e5e7eb;color:#9ca3af;display:grid;place-items:center;font-weight:800;font-size:14px;transition:all .3s}
  .stp .lbl{font-size:11.5px;font-weight:650;color:#9ca3af;white-space:nowrap;transition:color .3s}
  .stp.active .ball{background:var(--indigo);color:#fff}
  .stp.active .lbl{color:var(--indigo)}
  .stp.done .ball{background:var(--green);color:#fff}
  .stp.done .lbl{color:var(--green)}

/* ---------------- boot: manifest + data + local CLIP ---------------- */
async function loadManifest(){
  try{
    // The service worker checks this small file network-first and stores one
    // canonical copy. A timestamp here would defeat persistent caching.
    const r = await fetch('data/manifest.json', {cache:'no-store'});
    if(!r.ok) throw new Error('manifest '+r.status);
    MAN = await r.json();
  }catch(e){ MAN = FALLBACK; }
}
function loadBin(name){
  return fetch('data/'+name+'?v='+(MAN.dataVersion||'0')).then(r=>{ if(!r.ok) throw new Error(name+' '+r.status); return r.arrayBuffer();})
            .then(b=>new Float32Array(b));
}
const BOOT_TIMEOUT = 180000;
let bootPromise = null;
const withTimeout = (promise, ms, label) => Promise.race([
  promise,
  new Promise((_, reject) => setTimeout(() => reject(new Error(tt('timeout',{l:label,s:Math.round(ms/1000)}))), ms))
]);
async function cacheSummary(){
  if(!('caches' in window)) return '';
  try{
    const names = await caches.keys();
    const namesToCheck = names.filter(n => n.startsWith('figureforge-static-'));
    if(!namesToCheck.length) return '';
    let keys = [];
    for(const name of namesToCheck) keys = keys.concat(await caches.open(name).then(c => c.keys()));
    const hasModel = keys.some(r => /text_model_quantized\.onnx$/.test(new URL(r.url).pathname));
    const hasIndex = keys.some(r => /(?:image_emb|text_emb)\.bin(?:\?.*)?$/.test(new URL(r.url).pathname + new URL(r.url).search));
    return hasModel && hasIndex ? tt('cache.hit') : tt('cache.will');
  }catch(e){ return ''; }
}
async function boot(){
  if(bootPromise) return bootPromise;
  bootPromise = (async() => {
  window.__t = window.__t||[]; const started = performance.now();
  const L = m => window.__t.push(Math.round(performance.now())+' '+m);
  const bt = $('#bootText');
  const cacheHint = await cacheSummary();
  const show = m => { bt.textContent = m + '（已用 '+Math.round((performance.now()-started)/1000)+' 秒）'; };
  try{
    show(cacheHint ? tt('boot.cache') : tt('boot.manifest')); L('start');
    await withTimeout(loadManifest(), 30000, '模型清单加载'); L('manifest');
    const DV = MAN.dataVersion || '0';
    const [figs, ids, bm, IE, TE] = await withTimeout(Promise.all([
      fetch('data/figures.json?v='+DV).then(r=>r.json()),
      fetch('data/ids.json?v='+DV).then(r=>r.json()),
      fetch('data/bm25.json?v='+DV).then(r=>r.json()),
      loadBin('image_emb.bin'), loadBin('text_emb.bin'),
    ]), BOOT_TIMEOUT, '检索索引加载');
    L('data done');
    data = { ids, figs, bm, IE, TE, N: ids.length };
    show(tt('boot.clip1'));
    T.env.allowLocalModels = true;
    T.env.allowRemoteModels = false;
    T.env.localModelPath = new URL('./models/', import.meta.url).href;
    T.env.backends.onnx.wasm.wasmPaths = new URL('vendor/', document.baseURI).href;
    const MP = 'clip-vit-base-patch32';
    clip.tokenizer = await withTimeout(T.AutoTokenizer.from_pretrained(MP), BOOT_TIMEOUT, 'CLIP tokenizer 加载');
    L('tokenizer done');
    show(tt('boot.clip2'));
    clip.model = await withTimeout(T.CLIPTextModelWithProjection.from_pretrained(MP, {dtype:'q8'}), BOOT_TIMEOUT, 'CLIP 模型加载');
    L('model done');
    $('#bootBanner').hidden = true;
  }catch(e){
    L('ERR '+e.message);
    bt.innerHTML = '<span style="color:#991b1b">'+tt('boot.fail',{m:esc(e.message)})+'</span>';
  }
  })();
  return bootPromise;
}
async function queryVec(q){
  if(!clip.model) await boot();
  const inputs = clip.tokenizer(q, {padding:true, truncation:true});
  const out = await clip.model(inputs);
  const v = out.text_embeds.tolist()[0];
  const n = Math.hypot(...v);
  return v.map(x=>x/n);
}

/* ---------------- tokenize + BM25 ---------------- */
function tokenize(s){
  const toks = [];
  (s.toLowerCase().match(/[a-z0-9][a-z0-9\-\.]+/g)||[]).forEach(w=>toks.push(w));
  const cjk = s.replace(/[^一-鿿]/g,'');
  for(let i=0;i<cjk.length-1;i++) toks.push(cjk.slice(i,i+2));
  return toks;
}
function bm25Score(qt, docTokens, idf, k1, b, avgdl){
  const tf = {}; docTokens.forEach(t=>tf[t]=(tf[t]||0)+1);
  let s = 0, dl = docTokens.length;
  for(const t of qt){
    if(!(t in idf) || !tf[t]) continue;
    s += idf[t] * (tf[t]*(k1+1)) / (tf[t] + k1*(1-b+b*dl/avgdl));
  }
  return s;
}

/* ---------------- search ---------------- */
function dot(row, v, D=512){
  let s=0; const base = row*D;
  for(let j=0;j<D;j++) s += data.IE[base+j]*v[j];
  return s;
}
function dotT(row, v, D=512){
  let s=0; const base = row*D;
  for(let j=0;j<D;j++) s += data.TE[base+j]*v[j];
  return s;
}
function matchTier(f, t){
  if(t==='best') return f.award==='best' || f.award==='honorable';
  if(t==='oral') return f.tier==='oral' || f.award;
  if(t==='spotlight') return f.tier==='spotlight' || f.tier==='oral' || f.award;
  return true;
}
async function search(){
  const q = $('#paper').value.trim();
  const pv=$('#venue').value, yr=$('#year').value, tv=$('#tier').value, pt=$('#pattern').value;
  let clipScores = null;
  if(q){
    const qv = await queryVec(q);
    clipScores = new Float32Array(data.N);
    for(let i=0;i<data.N;i++) clipScores[i]=0.6*dot(i,qv)+0.4*dotT(i,qv);
  }
  const qt = q ? tokenize(q) : [];
  const bm = data.bm;
  const scored = [];
  for(let i=0;i<data.N;i++){
    const f = data.figs[i];
    if(pv!=='all' && f.venue!==pv) continue;
    if(yr!=='all' && f.year!=+yr) continue;
    if(tt!=='all' && !matchTier(f,tt)) continue;
    if(pt!=='all' && f.pattern!==pt) continue;
    let s;
    const bms = qt.length ? bm25Score(qt, bm.docs[i], bm.idf, bm.k1, bm.b, bm.avgdl) : 0;
    if(clipScores) s = 0.55*clipScores[i] + 0.45*(bms/(bms+4));
    else s = bms;
    scored.push({i, s});
  }
  if(q) scored.sort((a,b)=>b.s-a.s);
  else scored.sort((a,b)=>{                       // no query: browse like the gallery home page
    const fa=data.figs[a.i], fb=data.figs[b.i];
    return (VENUE_RANK[fa.venue]??9)-(VENUE_RANK[fb.venue]??9) || fa.year-fb.year || String(fa.id).localeCompare(String(fb.id));
  });
  const hasQ = !!clipScores;
  results = scored.map(x=>{const f=data.figs[x.i];
    f.matchScore = hasQ ? Math.max(0,Math.min(100,Math.round(x.s*100))) : null; return f;});
  renderGrid(results);
}

const PAGE_SIZE = 60;
const VENUE_RANK = {iclr:0, icml:1, neurips:2, cvpr:3, acl:4, aaai:5};
let shown = 0;
function tierChip(f){
  if(f.award==='best') return '<span class="chip c-best">Best Paper</span>';
  if(f.award==='honorable') return '<span class="chip c-hm">Honorable Mention</span>';
  if(f.tier==='oral') return '<span class="chip c-oral">Oral</span>';
  if(f.tier==='spotlight') return '<span class="chip c-spot">Spotlight</span>';
  return '';
}
function cardHtml(f){
  const sel = refs.has(f.id);
  return `<div class="rc ${sel?'sel':''}" data-id="${esc(f.id)}" role="button" tabindex="0" aria-pressed="${sel}" aria-label="${tt(sel?'card.ariaSel':'card.aria',{t:esc(f.title)})}">
      <img class="thumb" loading="lazy" src="../${esc(f.image)}" alt="${esc(f.title)}">
      <div class="pick">${sel?tt('pick.sel'):tt('pick.add')}</div>
      <div class="score">${f.matchScore!=null?f.matchScore:''}</div>
      <div class="body">
        <h3>${esc(f.title)}</h3>
      <div class="chips">
          <span class="chip c-venue">${f.venue.toUpperCase()}</span>
          <span class="chip c-year">${f.year}</span>
          <span class="chip c-pattern">${esc(f.pattern)}</span>
          ${tierChip(f)}
        </div>
        <div class="rc-actions">
          <button class="rc-action rc-preview" type="button" data-id="${esc(f.id)}">${tt('act.preview')}</button>
          ${f.paper ? `<a class="rc-action" href="${esc(f.paper)}" target="_blank" rel="noopener" data-paper-link>${tt('act.paper')}</a>` : ''}
        </div>
      </div></div>`;
}
function updateGridHints(){
  const more = shown < results.length;
  $('#gridMore').hidden = !more;
  $('#gridEnd').hidden = more || results.length <= PAGE_SIZE;
  if(!more && results.length > PAGE_SIZE) $('#gridEnd').textContent = tt('grid.end',{n: results.length.toLocaleString()});
  $('#gridTotal').textContent = results.length ? tt('grid.total',{n: results.length.toLocaleString()}) : '';
}
function appendChunk(){
  const slice = results.slice(shown, shown+PAGE_SIZE);
  if(!slice.length) return;
  $('#grid').insertAdjacentHTML('beforeend', slice.map(cardHtml).join(''));
  shown += slice.length;
  updateGridHints();
}
function renderGrid(list){
  results = list;
  shown = 0;
  const box = $('#gridBox'); if(box) box.scrollTop = 0;
  if(!list.length){
    $('#grid').innerHTML = '<div class="empty-note">'+tt('grid.empty')+'</div>';
    updateGridHints();
    return;
  }
  $('#grid').innerHTML = '';
  appendChunk();
  // Fill the first screen right away; further chunks come from scroll / observer.
  requestAnimationFrame(()=>{ try{ maybeFill(); }catch(e){} });
}
/* Selection changes patch the single card, so a long loaded list is never re-rendered. */
function patchCard(card, id){
  const sel = refs.has(id);
  card.classList.toggle('sel', sel);
  card.setAttribute('aria-pressed', String(sel));
  const pick = card.querySelector('.pick'); if(pick) pick.textContent = sel?tt('pick.sel'):tt('pick.add');
  card.setAttribute('aria-label', tt(sel?'card.ariaSel':'card.aria',{t:card.querySelector('h3')?.textContent||''}));
}
function patchAllCards(){
  $('#grid').querySelectorAll('.rc').forEach(el=>patchCard(el, el.dataset.id));
  updateGridHints();
}
/* Keep appending while the “load more” sentinel sits near the bottom of the
   picker box (it is the scroll container now, not the window). */
function moreInRange(){
  const el = $('#gridMore'); if(!el || el.hidden) return false;
  const box = $('#gridBox'); if(!box) return false;
  return el.getBoundingClientRect().top < box.getBoundingClientRect().bottom + 600;
}
function maybeFill(){
  let guard = 0;
  while(moreInRange() && guard++ < 200) appendChunk();
}
const gridBoxEl = $('#gridBox');
if(gridBoxEl) gridBoxEl.addEventListener('scroll', ()=>{ maybeFill(); }, {passive:true});
window.addEventListener('resize', ()=>{ maybeFill(); }, {passive:true});
if('IntersectionObserver' in window){
  const io = new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)) maybeFill(); },
    {root: gridBoxEl || null, rootMargin:'600px'});
  io.observe($('#gridMore'));
}
function updateCount(){
  $('#countHint').textContent = refs.size ? tt('countHint',{n:refs.size,m:MAX_REFS}) : '';
  $('#clearBtn').hidden = refs.size===0;
}
$('#grid').addEventListener('click', e=>{
  const preview = e.target.closest('.rc-preview');
  if(preview){ e.preventDefault(); e.stopPropagation(); openForgeLightbox(preview.dataset.id); return; }
  if(e.target.closest('.thumb')){ e.preventDefault(); e.stopPropagation(); openForgeLightbox(e.target.closest('.rc').dataset.id); return; }
  if(e.target.closest('[data-paper-link]')){ e.stopPropagation(); return; }
  const card = e.target.closest('.rc'); if(!card) return;
  const id = card.dataset.id;
  if(refs.has(id)) refs.delete(id);
  else { if(refs.size>=MAX_REFS){ showErr(tt('err.maxrefs',{m:MAX_REFS})); return;} refs.add(id); }
  patchCard(card, id); updateCount(); renderRefsStrip();
});
$('#grid').addEventListener('keydown', e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const card=e.target.closest('.rc'); if(!card) return;
  if(e.target.closest('.rc-preview')){ e.preventDefault(); openForgeLightbox(card.dataset.id); return; }
  e.preventDefault(); card.click();
});
$('#clearBtn').onclick = ()=>{ refs.clear(); patchAllCards(); updateCount(); renderRefsStrip(); };
function renderRefsStrip(){
  if(!refs.size){ $('#refsStrip').innerHTML='<span class="hint" style="margin:0">'+tt('refs.strip2')+'</span>'; return; }
  $('#refsStrip').innerHTML = [...refs].map(id=>{
    const f = data.figs.find(x=>x.id===id);

      <span>${f.venue.toUpperCase()} ${f.year} · ${esc(f.pattern)}</span></div>

$('#refsStrip').addEventListener('click', e=>{
  const x = e.target.closest('.x'); if(!x) return;
  const id = x.dataset.id; refs.delete(id);

/* ---------------- reference lightbox ---------------- */
let forgeLbIndex = -1;
const forgeLb = $('#forgeLightbox'), forgeLbDialog = forgeLb.querySelector('.forge-lb-dialog');
function updateForgeLightbox(){
  const f = results[forgeLbIndex]; if(!f) return;
  $('#forgeLbImg').src = '../' + f.image;
  $('#forgeLbImg').alt = f.title;
  $('#forgeLbTitle').textContent = f.title;
  $('#forgeLbMeta').textContent = `${f.venue.toUpperCase()} ${f.year} · ${f.pattern}`;
  $('#forgeLbImage').href = '../' + f.image;
  const paper = $('#forgeLbPaper'); paper.href = f.paper || '#'; paper.hidden = !f.paper;
  $('#forgeLbPrev').disabled = forgeLbIndex <= 0;
  $('#forgeLbNext').disabled = forgeLbIndex >= results.length - 1;
}
function openForgeLightbox(id){
  const i = results.findIndex(f=>f.id===id); if(i<0) return;
  forgeLbIndex=i; updateForgeLightbox(); forgeLb.hidden=false; document.body.style.overflow='hidden';
  $('#forgeLbClose').focus({preventScroll:true});
}
function closeForgeLightbox(){ forgeLb.hidden=true; document.body.style.overflow=''; }
function stepForgeLightbox(delta){
  const next=forgeLbIndex+delta; if(next<0 || next>=results.length) return;
  forgeLbIndex=next; forgeLbDialog.classList.remove('swap-next','swap-prev'); void forgeLbDialog.offsetWidth;
  forgeLbDialog.classList.add(delta>0?'swap-next':'swap-prev'); updateForgeLightbox();
}
$('#forgeLbClose').onclick=closeForgeLightbox;
$('#forgeLbPrev').onclick=()=>stepForgeLightbox(-1);
$('#forgeLbNext').onclick=()=>stepForgeLightbox(1);
forgeLb.addEventListener('click',e=>{ if(e.target===forgeLb) closeForgeLightbox(); });
document.addEventListener('keydown',e=>{
  if(forgeLb.hidden) return;
  if(e.key==='Escape') closeForgeLightbox();
  else if(e.key==='ArrowLeft') stepForgeLightbox(-1);
  else if(e.key==='ArrowRight') stepForgeLightbox(1);
});

/* ---- local PDF text extraction (transport only: the model still picks and
   summarises the sections; used when a provider refuses a document part) ---- */
const MAX_PDF_CHARS = 60000;
const MAX_PDF_IMAGES = 8;
let pdfjsPromise = null;
function loadPdfjs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='./vendor/pdf.min.js';
    s.onload=()=>{
      if(!window.pdfjsLib) return reject(new Error('pdf.js 加载失败'));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdf.worker.min.js', document.baseURI).href;
      resolve(window.pdfjsLib);
    };
    s.onerror=()=>reject(new Error('pdf.js 加载失败'));
    document.head.appendChild(s);
  });
  return pdfjsPromise;
}
let pdfText = null, pdfImgs = null;
function pdfBytes(){
  // pdf.js takes ownership of the buffer it is given (it transfers it to the
  // worker), so every call has to hand over an independent copy — otherwise a
  // second extraction (text, then page images) fails on a detached buffer.
  if(pdfContext.buf) return new Uint8Array(pdfContext.buf.slice(0));
  const part = pdfDataPart(); if(!part) throw new Error(tt('ps.nodata'));
  const bin = atob(part.data); const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function extractPdfText(){
  if(pdfText && pdfText.name===pdfContext.fileName) return pdfText;
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({data: pdfBytes(), isEvalSupported:false}).promise;
  const pages = [];
  for(let p=1;p<=doc.numPages;p++){
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    pages.push('【第 '+p+' 页】\n'+tc.items.map(i=>i.str).join(' '));
  }
  const text = pages.join('\n\n').replace(/[ \t]{2,}/g,' ').trim();
  pdfText = {name:pdfContext.fileName, text, chars:text.length, pages:doc.numPages};
  return pdfText;
}
/* Page images: the universal channel for vision models — works for scanned
   papers and keeps layout, figures and tables readable. */
async function extractPdfImages(){
  if(pdfImgs && pdfImgs.name===pdfContext.fileName) return pdfImgs;
  const lib = await loadPdfjs();
  const doc = await lib.getDocument({data: pdfBytes(), isEvalSupported:false}).promise;
  const n = Math.min(doc.numPages, MAX_PDF_IMAGES);
  const imgs = [];
  for(let p=1;p<=n;p++){
    const page = await doc.getPage(p);
    const base = page.getViewport({scale:1});
    const scale = Math.max(1, Math.min(1.6, 1400/Math.max(base.width, base.height)));
    const vp = page.getViewport({scale});
    const cv = document.createElement('canvas');
    cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    imgs.push(cv.toDataURL('image/jpeg', 0.72));
  }
  pdfImgs = {name:pdfContext.fileName, imgs, pages:n, total:doc.numPages};
  return pdfImgs;
}
function showParseErr(msg){ const el=$('#parseErr'); if(!el) return; el.innerHTML=esc(tt('ps.errline',{m:msg})); el.hidden=false; }
function clearParseErr(){ const el=$('#parseErr'); if(el) el.hidden=true; }
function extractJsonObject(txt){
  const clean=(txt||'').replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
  const m=clean.match(/\{[\s\S]*\}/); if(!m) throw new Error('解析模型未返回 JSON');
  try{return JSON.parse(m[0]);}catch(e){throw new Error('解析模型返回的 JSON 无法读取');}
}
/* Which document channel does the selected provider/base URL really accept?
   Providers with an OpenAI-compatible /responses route (verified to exist on
   OpenAI, Ark, GLM and Qwen) may take the PDF natively through `input_file`;
   Anthropic takes a `document` block; a relay/custom base takes the file part.
   Everything else goes through locally extracted text or page images. */
const RESPONSES_DOC = new Set(['oai','ark','glm','qwen']);
function docMode(){
  const c=cfg(), base=baseURL(), p=$('#provider').value;
  if($('#baseOverride').value.trim() || p==='custom') return 'oai_file';
  if(c.proto==='anthropic') return modelSeesImages() ? 'anthropic' : 'none';
  if((/openai\.com/i.test(base) || RESPONSES_DOC.has(p)) && modelSeesImages()) return 'openai_responses';
  return 'none';
}
/* Conservative capability check: the manifest lists text-only models in chat,
   vision-capable ones in vision. Unknown ids are given the benefit of the doubt. */
function modelSeesImages(){
  const m=parserModel()||'', c=cfg();
  if((c.vision||[]).includes(m)) return true;
  if((c.chat||[]).includes(m)) return false;
  return /vl|vision|visual|gpt-|claude|gemini|seed|qwen|glm|hunyuan|kimi|image/i.test(m);
}
function anthropicHeaders(key){
  return {'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'};
}
/* mode: 'doc' native document part · 'text' locally extracted text ·
   'img' locally rendered page images (vision models) */
async function callPdfParser(mode, payload){
  const c=cfg(), base=baseURL(), key=cleanKey($('#key').value), model=parserModel();
  if(!base||!key||!model) throw new Error(tt('ps.nocfg'));
  const instruction=parserInstruction($('#target').value,$('#contentQuery').value.trim());
  let r, body;
  if(mode==='text'){
    const ex=payload;
    const text = instruction+'\n\n'+tt('ps.texthdr',{f:pdfContext.fileName,p:ex.pages})+'\n'+ex.text.slice(0, MAX_PDF_CHARS);
    if(c.proto==='anthropic'){
      body={model,max_tokens:5000,system:'只输出严格 JSON。',messages:[{role:'user',content:[{type:'text',text}]}]};
      r=await fetchWithTimeout(base+'/v1/messages',{method:'POST',headers:anthropicHeaders(key),body:JSON.stringify(body)},180000);
    }else if(/openai\.com/i.test(base)){
      body={model,input:[{role:'user',content:[{type:'input_text',text}]}],max_output_tokens:5000};
      r=await fetchWithTimeout(base+'/responses',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(body)},180000);
    }else{
      body={model,temperature:0.1,max_tokens:5000,messages:[{role:'system',content:'只输出严格 JSON。'},{role:'user',content:text}]};
      if($('#provider').value==='ark') body.thinking={type:'disabled'};
      r=await postJSON(base,'/chat/completions',body,key);
    }
  }else if(mode==='img'){
    const ex=payload;
    const note = instruction+'\n\n'+tt('ps.imgthdr',{f:pdfContext.fileName,p:ex.pages,t:ex.total});
    if(c.proto==='anthropic'){
      const blocks=ex.imgs.map(u=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:dataURIToParts(u).data}}));
      blocks.push({type:'text',text:note});
      body={model,max_tokens:5000,system:'只输出严格 JSON。',messages:[{role:'user',content:blocks}]};
      r=await fetchWithTimeout(base+'/v1/messages',{method:'POST',headers:anthropicHeaders(key),body:JSON.stringify(body)},180000);
    }else if(/openai\.com/i.test(base)){
      const content=ex.imgs.map(u=>({type:'input_image',image_url:u}));
      content.push({type:'input_text',text:note});
      body={model,input:[{role:'user',content}],max_output_tokens:5000};
      r=await fetchWithTimeout(base+'/responses',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(body)},180000);
    }else{
      const content=ex.imgs.map(u=>({type:'image_url',image_url:{url:u}}));
      content.push({type:'text',text:note});
      body={model,temperature:0.1,max_tokens:5000,messages:[{role:'system',content:'只输出严格 JSON。'},{role:'user',content}]};
      if($('#provider').value==='ark') body.thinking={type:'disabled'};
      r=await postJSON(base,'/chat/completions',body,key);
    }
  }else{
    // Native document part — shape depends on what the endpoint accepts.
    const dm=docMode();
    const part=pdfDataPart(); if(!part) throw new Error(tt('ps.nodata'));
    if(dm==='anthropic'){
      const blocks=[{type:'document',source:{type:'base64',media_type:part.media||'application/pdf',data:part.data}},
                    {type:'text',text:instruction}];
      body={model,max_tokens:5000,system:'只输出严格 JSON。',messages:[{role:'user',content:blocks}]};
      r=await fetchWithTimeout(base+'/v1/messages',{method:'POST',headers:anthropicHeaders(key),body:JSON.stringify(body)},180000);
    }else if(dm==='openai_responses'){
      body={model,input:[{role:'user',content:[{type:'input_file',filename:pdfContext.fileName,file_data:pdfContext.dataUri},{type:'input_text',text:instruction}]}],max_output_tokens:5000};
      r=await fetchWithTimeout(base+'/responses',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(body)},180000);
    }else{
      body={model,temperature:0.1,max_tokens:5000,messages:[{role:'system',content:'只输出严格 JSON。'},{role:'user',content:[{type:'file',file:{filename:pdfContext.fileName,file_data:pdfContext.dataUri}},{type:'text',text:instruction}]}]};
      r=await postJSON(base,'/chat/completions',body,key);
    }
  }
  const raw=await r.text(); if(!r.ok) throw new Error(friendlyHttp(r.status,raw));
  return extractJsonObject(parseResponseText(JSON.parse(raw)));
}
function renderPdfSummary(data){
  const sections=Array.isArray(data.selectedSections)?data.selectedSections.filter(x=>x&&x.summary).slice(0,6):[];
  if(!sections.length) throw new Error('解析模型没有返回相关章节摘要');
  const pieces=[data.title&&`标题：${data.title}`,data.abstract&&`摘要要点：${data.abstract}`,sections.map(x=>`【${x.section||'相关章节'}】${x.summary}${x.evidence?`\n证据：${x.evidence}`:''}`).join('\n\n'),data.figurePrompt&&`绘图提示词：${data.figurePrompt}`].filter(Boolean);
  $('#paper').value=pieces.join('\n\n').slice(0,12000);
}
function setParseStatus(state){
  const el=$('#contentModeHint'); el.dataset.state=state;
  el.dataset.label={idle:tt('hint.label'),loading:tt('ps.loading'),success:tt('ps.success'),error:tt('ps.error')}[state];
}
async function selectPdfContext(){
  if(!pdfContext || $('#contentMode').value==='free') return;
  const seq=++pdfIntentSeq;
  const setHint = (key,vars)=>{ setParseStatus('loading'); $('#contentModeHint').textContent=tt(key,vars||{}); };
  clearParseErr();
  setHint('ps.sending');
  setExtractMetaKey('ps.meta1', {m:parserModel()||'–'}, false);
  // Channel order: the provider's own document part when it has one, then the
  // locally extracted text, then rendered page images (vision models).
  const order=[];
  if(docMode()!=='none') order.push('doc');
  order.push('text');
  if(modelSeesImages()) order.push('img');
  const failures=[];
  try{
    let result=null, used=null;
    for(const ch of order){
      if(seq!==pdfIntentSeq) return;
      try{
        let payload=null;
        if(ch==='text'){
          setHint('ps.extracting');
          setExtractMetaKey('ps.meta1b', {m:parserModel()||'–'}, false);
          payload = await extractPdfText();
          if(payload.chars < 200){                       // scanned / image-only PDF
            failures.push(tt('ps.scanned',{m:failures[0]||'–'}).replace(/[。．.\s]+$/,''));
            continue;
          }
        }else if(ch==='img'){
          setHint('ps.rendering');
          setExtractMetaKey('ps.meta1c', {m:parserModel()||'–'}, false);
          payload = await extractPdfImages();
        }
        result = await callPdfParser(ch, payload);
        used = ch;
        break;
      }catch(e){
        if(seq!==pdfIntentSeq) return;
        const label = ch==='img'?tt('ps.modeImg'):ch==='text'?tt('ps.modeText'):tt('ps.modeDoc');
        failures.push(label+': '+String(e.message||e).replace(/[。．.；;\s]+$/,''));
      }
    }
    if(!result) throw new Error(tt('ps.allfailed',{m:parserModel()||'–',e:failures.join('；')}));
    if(seq!==pdfIntentSeq) return;
    renderPdfSummary(result);
    setParseStatus('success');
    $('#contentModeHint').textContent=tt('ps.done');
    const n=result.selectedSections.length, f=pdfContext.fileName, m=parserModel();
    if(used==='text')      setExtractMetaKey('ps.meta2t', {f,m,n,c:(pdfText?pdfText.chars:0).toLocaleString()}, false);
    else if(used==='img')  setExtractMetaKey('ps.meta2i', {f,m,n,p:(pdfImgs?pdfImgs.pages:0)}, false);
    else                   setExtractMetaKey('ps.meta2',  {f,m,n}, false);
  }catch(err){
    if(seq!==pdfIntentSeq) return;
    setParseStatus('error');
    $('#contentModeHint').textContent=tt('ps.fail');
    setExtractMetaKey('ps.meta3', null, true);
    showParseErr(err.message);
    showErr(tt('err.pdfparse',{m:err.message}));
  }
}
function syncContentMode(reparse=true){
  const mode=$('#contentMode').value; $('#contentQueryRow').hidden=mode!=='custom';
  setParseStatus('idle');
  $('#contentModeHint').textContent=contentModeText(mode);
  if(reparse && pdfContext && mode!=='free') selectPdfContext();
}

$('#pdfFile').onchange=async e=>{
  const file=e.target.files[0]; if(!file)return;
  const btn=$('#uploadBtn'); btn.disabled=true; btn.setAttribute('aria-busy','true'); $('#uploadLabel').textContent=tt('up.reading');
  try{
    if(file.size>25*1024*1024) throw new Error(tt('up.size'));
    const dataUri=await fileToDataURI(file);
    const buf=await file.arrayBuffer();
    pdfContext={fileName:file.name,mime:file.type||'application/pdf',dataUri,buf,size:file.size};
    pdfText=null;
    setExtractMetaKey('up.meta', {f:file.name,s:Math.round(file.size/1024)}, false);
    if($('#contentMode').value!=='free') await selectPdfContext();
  }catch(err){ showErr(tt('up.fail',{m:err.message})); showParseErr(tt('up.fail',{m:err.message})); }
  finally{ btn.disabled=false; btn.removeAttribute('aria-busy'); $('#uploadLabel').textContent=tt('upload'); e.target.value=''; }
};

/* ---------------- reference images -> data URI ---------------- */
function fileToDataURI(blob){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onload = ()=>resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
}
async function blobToShrunkURI(blob, maxSide=1280){
  if(blob.type==='image/gif' || blob.type==='image/svg+xml') return fileToDataURI(blob);
  try{
    const bmp = await createImageBitmap(blob);
    const s = Math.min(1, maxSide/Math.max(bmp.width,bmp.height));
    const w=Math.max(1,Math.round(bmp.width*s)), h=Math.max(1,Math.round(bmp.height*s));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(bmp,0,0,w,h);
    bmp.close && bmp.close();
    return cv.toDataURL('image/jpeg',0.82);
  }catch(e){ return fileToDataURI(blob); }
}
async function refDataURIs(refIds){
  const out = [];
  for(const id of (refIds||[...refs])){
    const f = data.figs.find(x=>x.id===id);
    const r = await fetch('../'+f.image);
    if(!r.ok) throw new Error(tt('ref.fail',{f:f.image}));
    out.push(await blobToShrunkURI(await r.blob()));
  }
  return out;
}
function dataURIToParts(uri){
  const m = uri.match(/^data:(.*?);base64,(.*)$/);
  return m ? {media:m[1]||'image/jpeg', data:m[2]} : null;
}

/* ---------------- providers / models (manifest + live) ---------------- */
function cfg(){ return MAN.providers[$('#provider').value]; }
function baseURL(){
  const ov = $('#baseOverride').value.trim();
  return (ov || cfg().base).replace(/\/+$/,'');
}
const key_present = ()=>!!cleanKey($('#key').value);
function fetchOnlineModels(){
  const key = cleanKey($('#key').value), base = baseURL(), c = cfg();
  if(!key || !base) return Promise.resolve({ok:false,list:[]});
  // Anthropic exposes GET /v1/models too (verified readable from the browser once the
  // direct-browser header is present), so Claude users get a live list as well.
  const url = c.proto==='anthropic' ? base+'/v1/models' : base+'/models';
  const headers = c.proto==='anthropic' ? anthropicHeaders(key) : {'Authorization':'Bearer '+key};
  return fetch(url,{headers})
    .then(r=>r.ok ? r.json() : Promise.reject(new Error('http '+r.status)))
    .then(d=>({ok:true,list:(d.data||d.models||[]).map(x=>x.id||x.model||x.name).filter(Boolean)}))
    .catch(()=>({ok:false,list:[]}));
}
/* Warn when the picked model is missing from the account's live list: on Ark / Hunyuan
   the browser cannot query /models at all, so those providers skip this check. */
const liveModels = { model:null, parser:null };
function checkModelEnabled(selId, warnId, list){
  const sel = $(selId), warn = $(warnId);
  if(!sel || !warn) return;
  const on = !!(list && list.length) && !!sel.value && !list.includes(sel.value);
  warn.hidden = !on;
  if(on) warn.textContent = tt('warn.notenabled',{m:sel.value});
}
function optgroup(label){
  const g=document.createElement('optgroup'); g.label=label; return g;
}
function option(s){
  const o=document.createElement('option'); o.value=s; o.textContent=s; return o;
}
async function populateModels(){
  const p = $('#provider').value, c = cfg();
  const s = $('#model'); s.innerHTML='';
  if(p==='custom'){
    s.appendChild(optgroup(tt('og.custom')));
  }else if(mode==='svg'){
    if(c.chat.length){ const g=optgroup(tt('og.chat')); c.chat.forEach(m=>g.appendChild(option(m))); s.appendChild(g); }
    if(c.vision.length){ const g=optgroup(tt('og.vision')); c.vision.forEach(m=>g.appendChild(option(m))); s.appendChild(g); }
  }else{
    if(c.image.length){ const g=optgroup(tt('og.image')); c.image.forEach(m=>g.appendChild(option(m))); s.appendChild(g); }
  }
  const wanted = mode==='svg' ? 'chat' : 'image';
  const res = await fetchOnlineModels();
  const online = res.list;
  const yours = online.filter(m=>kindOf(m)===wanted);
  if(yours.length){
    const g=optgroup(tt('og.yours',{d:new Date().toLocaleDateString()}));
    [...new Set(yours)].forEach(m=>g.appendChild(option(m))); s.appendChild(g);
  }else if(key_present() && !res.ok){
    const g=optgroup(tt('og.nolive'));
    const o=option(tt('og.hosted')); o.disabled=true; g.appendChild(o); s.appendChild(g);
  }
  const saved = localStorage.getItem('ff_model_'+p);
  if(saved && [...s.options].some(o=>o.value===saved)) s.value=saved;
  liveModels.model = res.ok ? online : null;
  checkModelEnabled('#model','#modelWarn',liveModels.model);
  if(mode==='image' && passMode==='two') populateAnalyzeModels();
}

  if(saved && [...s.options].some(o=>o.value===saved)) s.value=saved;

async function populateAnalyzeModels(){

const ANALYZE_SYS = 'You are an expert scientific-figure design analyst. You receive several top-conference overview figures of the SAME target visual type. Extract their shared layout grammar as a CONCRETE design contract: exact hex colours, panel rectangles as numbers on a 1600x900 canvas, a numeric type scale and stroke widths. Return STRICT JSON only.';
function buildAnalyzePrompt(n, idList){
  const ids = (idList||[]).join(', ');
  return `Here are ${n} top-conference paper figures, all of the target visual type for the figure I want to design.
Analyze their COMMON design grammar and return one JSON object with EXACTLY these keys:
{"layout":"how the canvas is divided (number/arrangement of panels) and reading direction",
 "panels":[{"name":"panel name","role":"what this panel shows","x":0,"y":0,"w":0,"h":0}],
 "palette":{"background":"#hex","primary":"#hex","accent":"#hex","neutral":"#hex","others":["#hex"]},
 "typography":{"title":0,"panelHeader":0,"label":0,"note":0},
 "strokes":{"box":0,"arrow":0,"connector":0},

Rules: output JSON only, no markdown or commentary.
panels: 2-6 entries. x/y/w/h are integers in a 1600x900 coordinate space with the origin at the top-left; they must not overlap and must stay inside 1600x900.
palette: every value MUST be a real #rrggbb hex string.
typography: integer pixel sizes for a 1600x900 canvas (title 36-56, panelHeader 26-36, label 20-30, note 16-22).

function extractJSON(txt){
  const m = txt.match(/\{[\s\S]*\}/);

}
async function analyzeReferences(){
  const ordered=[...refs];
  const uris=await refDataURIs();
  const c=cfg(), relay=$('#baseOverride').value.trim();

  let txt;
  if(useAnthropic){
    const blocks=uris.map(u=>{const p=dataURIToParts(u);return {type:'image',source:{type:'base64',media_type:p.media,data:p.data}};});
    blocks.push({type:'text',text:buildAnalyzePrompt(ordered.length, ordered)});
    const body={model:$('#analyzeModel').value||$('#model').value,max_tokens:3000,system:ANALYZE_SYS,messages:[{role:'user',content:blocks}]};
    const r=await fetch(baseURL()+'/v1/messages',{method:'POST',headers:anthropicHeaders(cleanKey($('#key').value)),body:JSON.stringify(body)});
    txt=await r.text(); if(!r.ok) throw new Error(friendlyHttp(r.status,txt));
    const d=JSON.parse(txt); txt=(d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  }else{

  }

  // Representative figures may come back as ids (preferred, unambiguous) or as

  // in the analysed set, so a miscount can no longer silently pick the wrong figure.
  const validIds = ordered.filter(id=>data.figs.some(f=>f.id===id));

/* Turn the analysis result into a compact, checkable design contract. Prose like
   "restrained palette, clear hierarchy" leaves every concrete decision to the
   generator, which is where style drift comes from; exact values pin it down. */
function designContractText(j){
  if(!j) return '';
  const rows = [];
  if(j.layout) rows.push(`- canvas & panel division: ${j.layout}`);
  if(Array.isArray(j.panels) && j.panels.length){
    const panels = j.panels.slice(0,8).map(p=>{
      const bits = [p.name, p.role].filter(Boolean).join(' / ');
      const geo = (p.x!=null && p.y!=null && p.w!=null && p.h!=null)
        ? ` x=${p.x} y=${p.y} w=${p.w} h=${p.h}` : '';
      return `${bits}${geo}`;
    });
    rows.push(`- panel geometry (canvas 1600x900, origin top-left): ${panels.join(' | ')}`);
  }
  const pal = j.palette;
  if(pal){
    if(Array.isArray(pal)) rows.push(`- palette (use these exact hex values): ${pal.join(', ')}`);
    else if(typeof pal === 'object'){
      const used = ['background','primary','accent','neutral'].filter(k=>pal[k]).map(k=>`${k}=${pal[k]}`);
      const extra = Array.isArray(pal.others) ? pal.others.join(', ') : '';
      rows.push(`- palette (use these exact hex values): ${used.concat(extra?[extra]:[]).join(', ')}`);
    } else rows.push(`- palette: ${pal}`);
  }
  const ty = j.typography;
  if(ty && typeof ty === 'object'){
    const t = ['title','panelHeader','label','note'].filter(k=>ty[k]!=null).map(k=>`${k} ${ty[k]}px`);
    if(t.length) rows.push(`- type scale (px, on a 1600x900 canvas): ${t.join(', ')}`);
  }
  const st = j.strokes;
  if(st && typeof st === 'object'){
    const s = ['box','arrow','connector'].filter(k=>st[k]!=null).map(k=>`${k} ${st[k]}px`);
    if(s.length) rows.push(`- stroke widths: ${s.join(', ')}`);
  }
  if(j.elements) rows.push(`- recurring elements: ${j.elements}`);
  if(j.hierarchy) rows.push(`- information hierarchy: ${j.hierarchy}`);
  return rows.join('\n');
}

function buildPrompt(content, layoutGuide, refIds){
  const t = $('#target').value;
  const targetInfo = t==='custom'
    ? ($('#targetDesc').value.trim() || content)
    : TARGETS[t].instr;
  const useIds = refIds || [...refs];
  const refLines = useIds.map((id,idx)=>{
    const f = data.figs.find(x=>x.id===id);
    // Follows the UI language; this was hardcoded Chinese, so an English session
    // still injected Chinese instructions into an English-generation prompt.
    return tt('ref.note',{i:idx+1, t:f.title, v:f.venue.toUpperCase(), y:f.year, p:f.pattern, id:f.id});
  }).join('\n');
  const guide = layoutGuide
    ? `## Design contract (merged from ${refs.size} same-type gallery figures — follow the panel division, arrows, palette and hierarchy strictly)\n${layoutGuide}\n\n`
    : '';
  return `你是顶尖 ML 论文的配图设计师。我要：${TARGETS[t].label}。
${guide}${targetInfo}

我的论文内容：
${content}

${refLines}

请输出一张极简、完整、可编辑的 SVG（viewBox 1600x900，横向，白色背景，主色一个、强调色一个，留白充足；方块/箭头/文字标签对齐；不得出现 lorem ipsum 或占位数字）。
若上面的设计契约给出了面板坐标与字号，请直接按其数值排版，不要自行改变比例。
只画一个清晰的主面板：聚焦“我们的方法”核心 pipeline（标题 + 若干模块方块 + 箭头表示数据流），不要画 baseline 对比、不要多个子面板、不要重复图形；把重复样式放进 <defs> 复用，总代码尽量短，务必在一次输出内以 </svg> 正常结尾。
布局硬性要求（会自动检查）：所有可见文字必须完全落在 x=0..1600、y=0..900 之内；任何标签的文字宽度不得超过它所处方块的宽度（放不下就缩短文字、减小字号或加宽方块）；不同标签的文字包围盒不得相互重叠。
硬性要求：SVG 中所有可见文字（面板标题、模块名、坐标轴、图例、注释）必须全部使用英文短语，严禁出现任何中文字符；数字与标签需与论文内容一致。
Output a complete SVG. ALL visible text (panel headers, module names, axes, legends, annotations) MUST be in English — no Chinese characters anywhere. Output only the <svg> code, no explanation.`;
}
const SVG_SYS = 'You are a world-class scientific figure designer. Based on the user paper content and the attached reference figures, output exactly ONE complete, self-contained SVG. White background, flat modern design, clear panels, arrows, short accurate labels taken from the paper. Output SVG markup only, no explanations or code fences.';

function showErr(msg){
  const box=$('#genErr'); box.hidden=false; box.innerHTML='<div>'+esc(msg)+'</div>';

/* Append the provider + endpoint so an error report identifies the account and API. */
function apiContext(){
  try{
    const c = cfg();
    return tt('err.ctx',{p:(c&&c.label)||$('#provider').value||'–', b:baseURL()||'–'});
  }catch(e){ return ''; }
}
function friendlyHttp(status, txt){
  let code='', body='';
  try{ const d=JSON.parse(txt); code=d.error?.code||d.code||''; body=(d.error?.message||d.message||''); }catch{}
  if(code==='AccountOverdueError' || /overdue|欠费|余额不足/i.test(txt)) return tt('err.overdue')+apiContext();
  if(status===401) return tt('err.401')+apiContext();
  if(status===404){
    // Ark (and Hunyuan) cannot be listed from the browser, so a wrong pick can only be
    // discovered here: Ark answers 404 ModelNotOpen until the model is activated in the
    // console — spell that out instead of a bare "not found".
    if($('#provider').value==='ark' || /ModelNotOpen/i.test(txt))
      return tt('err.notopen',{t:txt.slice(0,160)})+apiContext();
    if(/not activated|is not open|未开通|not enabled/i.test(txt))
      return tt('err.notenabled',{t:txt.slice(0,160)})+apiContext();
    return tt('err.404')+apiContext();
  }
  if(status===429) return tt('err.429')+apiContext();
  if(status===403){
    // SiliconFlow answers 403 {"code":30003,"message":"Model disabled."} when a model
    // needs real-name verification or is switched off for the account; other providers
    // say "no access to model" / "not enabled". Give the actionable wording.
    if(String(code)==='30003' || /model disabled|not enabled|does not have access|no access to model|未开通|无权限/i.test(body||txt))
      return tt('err.forbidden',{t:txt.slice(0,200)})+apiContext();
    return tt('err.403',{t:txt.slice(0,200)})+apiContext();
  }
  if(status===400) return tt('err.400',{t:txt.slice(0,200)})+apiContext();
  return tt('err.http',{s:status,t:txt.slice(0,200)})+apiContext();
}
function postJSON(base, path, body, key, extraHeaders, timeoutMs=300000){
  return fetchWithTimeout(base+path,{method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+key,...extraHeaders},
    body:JSON.stringify(body)},timeoutMs);
}
function fetchWithTimeout(url, options={}, timeoutMs=300000){
  const ac=new AbortController();
  const to=setTimeout(()=>ac.abort(new DOMException('timeout','TimeoutError')),timeoutMs);
  return fetch(url,{...options,signal:ac.signal}).finally(()=>clearTimeout(to));
}
/* When a POST fails at network level, find out WHY. Some providers (Ark) do
   not allow browser CORS on /models, and omit CORS headers on error responses,
   so the real 401/404 can be invisible to the page. */
async function diagnoseConnection(base, key, modelId, kind='chat'){
  // 1) model-list endpoint (works on providers that allow browser CORS on it)
  try{
    const r = await fetch(base+'/models',{headers:{Authorization:'Bearer '+key}});
    if(r.ok){
      let list=[];
      try{ const d=await r.json(); list=(d.data||d.models||[]).map(x=>x.id||x.model||x.name); }catch{}
      if(modelId && list.length && !list.includes(modelId))
        return tt('diag.notenabled',{m:modelId});
      return '';
    }
    if(r.status===401) return tt('err.401');
    if(r.status===403) return tt('diag.403');
  }catch(e){ /* /models unreachable from this browser (e.g. Ark) -> probe below */ }
  // 2) Ark-style fallback: a minimal chat call against the same model
  if(kind==='chat' && modelId){
    try{
      const probe={model:modelId,max_tokens:1,messages:[{role:'user',content:'hi'}]};
      if($('#provider').value==='ark') probe.thinking={type:'disabled'};
      const r=await postJSON(base,'/chat/completions',probe,key);
      if(r.ok) return '';  // key + model fine; original failure was payload/transient
      let txt=''; try{ txt=await r.text(); }catch{}
      if(r.status===401) return tt('err.401');
      if(r.status===404) return tt('diag.notenabledArk',{m:modelId});
      return friendlyHttp(r.status,txt);
    }catch(e){
      return tt('diag.unreachable');
    }
  }
  return tt('diag.generic');
}

async function genOaiSVG(base,model,key,content,p,refIds,layoutGuide){
  const useIds = refIds||[...refs];
  const prompt = buildPrompt(content,layoutGuide,useIds);
  let body = {model,temperature:0.3,max_tokens:8192}, usedVision=false;
  if(p==='ark') body.thinking={type:'disabled'};
  if(useIds.length && p!=='ds'){
    const uris = await refDataURIs(useIds);
    const parts = uris.map(u=>({type:'image_url',image_url:{url:u}}));
    parts.push({type:'text',text:prompt});
    body.messages=[{role:'system',content:SVG_SYS},{role:'user',content:parts}];
    usedVision=true;
  }else{
    body.messages=[{role:'system',content:SVG_SYS},{role:'user',content:prompt}];
  }
  let r;
  try{ r = await postJSON(base,'/chat/completions',body,key); }
  catch(e){
    if(e.name==='TimeoutError') throw new Error(tt('svg.timeout'));
    const diag=await diagnoseConnection(base,key,model);
    throw new Error(diag || tt('svg.blocked'));
  }
  let txt = await r.text();
  if(!r.ok && usedVision){
    body.messages=[{role:'system',content:SVG_SYS},{role:'user',content:prompt}]; usedVision=false;
    try{ r = await postJSON(base,'/chat/completions',body,key); txt=await r.text(); }catch(e){}
  }
  if(!r.ok) throw new Error(friendlyHttp(r.status,txt));
  const d = JSON.parse(txt);
  let svg = d.choices?.[0]?.message?.content||'';
  let code = (svg.match(/<svg[\s\S]*?<\/svg>/)||[])[0] || '';
  let truncated=false;
  if(!code){
    const s2 = svg.match(/<svg[\s\S]*$/);
    if(s2){ code = s2[0].replace(/```[\s\S]*$/,'').trim()+'</svg>'; truncated=true; }
  }
  if(!code) throw new Error(tt('svg.none'));
  const auditRes = await auditAndRepair(code, {base, model, key, provider:p, anthropic:false},
    (r,n)=>setGenNote(tt('audit.repairing',{r:r, n:n})));
  renderSVG(auditRes.svg, usedVision, useIds, truncated, auditRes);
}

async function genAnthropicSVG(base,model,key,content,refIds,layoutGuide){
  const useIds = refIds||[...refs];
  const prompt = buildPrompt(content,layoutGuide,useIds);
  let blocks = [], usedVision=false;
  if(useIds.length){
    const uris = await refDataURIs(useIds);
    uris.forEach(u=>{
      const p = dataURIToParts(u);
      if(p) blocks.push({type:'image',source:{type:'base64',media_type:p.media,data:p.data}});
    });
    usedVision = blocks.length>0;
  }
  blocks.push({type:'text',text:prompt});
  let body = {model,max_tokens:8192,temperature:0.3,system:SVG_SYS,messages:[{role:'user',content:blocks}]};
  let r;
  try{
    r = await fetch(base.replace(/\/+$/,'')+'/v1/messages',{method:'POST',
      headers:anthropicHeaders(key),
      body:JSON.stringify(body)});
  }catch(e){ throw new Error(tt('svg.claudeConn')); }
  let txt = await r.text();
  if(!r.ok && usedVision){
    body.messages=[{role:'user',content:prompt}]; usedVision=false;
    try{
      r = await fetch(base.replace(/\/+$/,'')+'/v1/messages',{method:'POST',
        headers:anthropicHeaders(key),
        body:JSON.stringify(body)});
      txt=await r.text();
    }catch(e){}
  }
  if(!r.ok) throw new Error(friendlyHttp(r.status,txt));
  const d = JSON.parse(txt);
  const out = (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  let code = (out.match(/<svg[\s\S]*?<\/svg>/)||[])[0] || '';
  let truncated=false;
  if(!code){
    const s2 = out.match(/<svg[\s\S]*$/);
    if(s2){ code = s2[0].replace(/```[\s\S]*$/,'').trim()+'</svg>'; truncated=true; }
  }
  if(!code) throw new Error(tt('svg.claudeNone'));
  const auditRes = await auditAndRepair(code, {base, model, key, provider:'claude', anthropic:true},
    (r,n)=>setGenNote(tt('audit.repairing',{r:r, n:n})));
  renderSVG(auditRes.svg, usedVision, useIds, truncated, auditRes);
}
/* ---------------- geometry audit: measure the draft before showing it ----------------
   The generator has no idea whether its own coordinates fit the canvas, and nothing
   checked: overflowing labels, text spilling out of its panel and colliding labels all
   shipped silently. This renders the SVG at the real canvas size off-screen and
   measures every label, so defects are facts rather than guesses. */
const AUDIT_TOLERANCE = 2;      // px of slack before something counts as outside
const OVERLAP_MIN = 12;         // px of intersection before labels count as colliding
const MAX_DEFECTS = 10;         // cap the repair instruction length
const MAX_REPAIR_ROUNDS = 2;

function readViewBox(svgEl){
  const vb = (svgEl.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
  if(vb.length===4 && vb.every(n=>isFinite(n)) && vb[2]>0 && vb[3]>0) return {x:vb[0],y:vb[1],w:vb[2],h:vb[3]};
  const w = parseFloat(svgEl.getAttribute('width'))||0, h = parseFloat(svgEl.getAttribute('height'))||0;
  if(w>0 && h>0) return {x:0,y:0,w:w,h:h};
  return null;
}

/* The box a label visually belongs to: the smallest painted rect on the canvas
   whose area contains the label's centre. Implemented by geometry rather than by
   ancestor lookup because generators emit both nested (<g><rect/><text/></g>) and
   flat (<rect/><text/> as siblings) structures, and an ancestor-only search finds
   nothing in the flat case. */
function panelBoxFor(node, labelBox, canvas){
  const cx = labelBox.x + labelBox.width/2;
  const cy = labelBox.y + labelBox.height/2;
  let best = null, bestArea = Infinity;
  [...canvas.querySelectorAll('rect')].forEach(rect=>{
    let b; try{ b = rect.getBBox(); }catch(e){ return; }
    if(!b || b.width<=2 || b.height<=2) return;
    if(b.width >= canvas.clientWidth - 1 && b.height >= canvas.clientHeight - 1) return;  // page background
    const pad = 2;
    if(cx < b.x+pad || cx > b.x+b.width-pad || cy < b.y+pad || cy > b.y+b.height-pad) return;
    const area = b.width*b.height;
    if(area < bestArea){ bestArea = area; best = {rect, box:b}; }
  });
  return best;
}

function auditGeometry(svgText){
  const defects = [];
  const stats = {texts:0, overflow:0, panel:0, overlap:0, panelsFound:0, panelSkipped:0, viewBox:null};
  let host=null;
  try{
    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    if(doc.querySelector('parsererror')) return {defects:[{kind:'parse', detail:'SVG could not be parsed'}], stats, broken:true, svgText};
    const root = doc.documentElement;
    if(!root || root.tagName.toLowerCase()!=='svg') return {defects:[{kind:'parse', detail:'root element is not <svg>'}], stats, broken:true, svgText};
    const vb = readViewBox(root);
    if(!vb) return {defects:[{kind:'parse', detail:'no usable viewBox or width/height'}], stats, broken:true, svgText};

    host = document.createElement('div');
    host.setAttribute('aria-hidden','true');
    host.style.cssText = `position:fixed;left:-100000px;top:0;width:${vb.w}px;height:${vb.h}px;overflow:hidden;pointer-events:none;`;
    const live = document.importNode(root, true);
    live.setAttribute('width', vb.w);
    live.setAttribute('height', vb.h);
    host.appendChild(live);
    document.body.appendChild(host);

    // Only <text> is measured: a <text> that contains <tspan> children already
    // covers them, and counting both would report phantom collisions.
    const nodes = [...host.querySelectorAll('text')].filter(n=>{
      const s = getComputedStyle(n);
      if(s.display==='none' || s.visibility==='hidden' || parseFloat(s.opacity)===0) return false;
      return (n.textContent||'').trim().length>0;
    });
    stats.texts = nodes.length;

    const boxes = [];
    nodes.forEach(n=>{
      let box;
      try{ box = n.getBBox(); }catch(e){ return; }   // <text> with no glyphs throws in some engines
      if(!box || box.width<=0 || box.height<=0) return;
      const label = (n.textContent||'').trim().replace(/\s+/g,' ').slice(0,42);
      boxes.push({box, label});

      const outL = vb.x - (box.x - AUDIT_TOLERANCE);
      const outT = vb.y - (box.y - AUDIT_TOLERANCE);
      const outR = (box.x + box.width) - (vb.x + vb.w) - AUDIT_TOLERANCE;
      const outB = (box.y + box.height) - (vb.y + vb.h) - AUDIT_TOLERANCE;
      if(outL>0 || outT>0 || outR>0 || outB>0){
        stats.overflow++;
        const parts = [];
        if(outL>0) parts.push(`left by ${Math.round(outL)}px`);
        if(outR>0) parts.push(`right by ${Math.round(outR)}px`);
        if(outT>0) parts.push(`top by ${Math.round(outT)}px`);
        if(outB>0) parts.push(`bottom by ${Math.round(outB)}px`);
        defects.push({kind:'overflow', label,
          detail:`label "${label}" runs past the canvas ${parts.join(' and ')}`,
          fix:`shorten this label or move/shrink it so it stays inside x=0..${Math.round(vb.w)}, y=0..${Math.round(vb.h)}`});
      }

      const panel = panelBoxFor(n, box, live);
      if(panel){
        stats.panelsFound++;
        const over = (box.x + box.width) - (panel.box.x + panel.box.width);
        if(over > AUDIT_TOLERANCE*3){
          stats.panel++;
          defects.push({kind:'panel', label,
            detail:`label "${label}" is ${Math.round(over)}px wider than the box it belongs to`,
            fix:`shorten this label, reduce its font-size, or widen that box so the text fits with padding`});
        }
      }
    });

    // Label collisions. Vertical overlap must be substantial, else an axis tick
    // and a caption that merely share a band would be reported.
    for(let i=0;i<boxes.length;i++){
      for(let j=i+1;j<boxes.length;j++){
        const a=boxes[i].box, b=boxes[j].box;
        const ox = Math.min(a.x+a.width, b.x+b.width) - Math.max(a.x, b.x);
        const oy = Math.min(a.y+a.height, b.y+b.height) - Math.max(a.y, b.y);
        if(ox>OVERLAP_MIN && oy>Math.min(a.height,b.height)*0.35){
          stats.overlap++;
          defects.push({kind:'overlap', label:boxes[i].label,
            detail:`"${boxes[i].label}" overlaps "${boxes[j].label}" by ${Math.round(ox)}x${Math.round(oy)}px`,
            fix:`separate these two labels (move, shorten or shrink) so they do not overlap`});
        }
      }
    }

    stats.viewBox = vb;
    return {defects:defects.slice(0, MAX_DEFECTS), stats, broken:false, svgText:new XMLSerializer().serializeToString(live)};
  }catch(e){
    return {defects:[{kind:'audit', detail:'audit failed: '+e.message}], stats, broken:false, svgText};
  }finally{
    if(host && host.parentNode) host.parentNode.removeChild(host);
  }
}

async function repairSVG(svgText, defects, req){
  const list = defects.map((d,i)=>`${i+1}. ${d.detail} -> ${d.fix}`).join('\n');
  const instruction =
`Fix ONLY the defects listed below. Change as little as possible: keep every panel, arrow, colour, position and label that is not named here.
Do not redesign, do not rename labels that are already correct, do not add or remove elements.
${list}

Return the complete corrected SVG only, no explanation, no code fences. Start with <svg and end with </svg>.`;
  const {base, model, key, provider} = req;
  if(req.anthropic){
    const body = {model, max_tokens:8192, temperature:0.1, system:SVG_SYS,
      messages:[{role:'user',content:[{type:'text',text:svgText},{type:'text',text:instruction}]}]};
    const r = await fetch(base.replace(/\/+$/,'')+'/v1/messages',{method:'POST',headers:anthropicHeaders(key),body:JSON.stringify(body)});
    const txt = await r.text();
    if(!r.ok) throw new Error(friendlyHttp(r.status, txt));
    const d = JSON.parse(txt);
    return (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  }
  const body = {model, temperature:0.1, max_tokens:8192,
    messages:[{role:'system',content:SVG_SYS},{role:'user',content:svgText+'\n\n'+instruction}]};
  if(provider==='ark') body.thinking={type:'disabled'};
  const r = await postJSON(base,'/chat/completions',body,key);
  const txt = await r.text();
  if(!r.ok) throw new Error(friendlyHttp(r.status, txt));
  const d = JSON.parse(txt);
  return d.choices?.[0]?.message?.content||'';
}

function extractSvgCode(raw){
  const code = (raw.match(/<svg[\s\S]*?<\/svg>/)||[])[0] || '';
  if(code) return {code, truncated:false, unterminated:false};
  const s2 = raw.match(/<svg[\s\S]*$/);
  if(s2) return {code:s2[0].replace(/```[\s\S]*$/,'').trim(), truncated:true, unterminated:true};
  return {code:'', truncated:false, unterminated:false};
}

/* Audit, then optionally repair. The current draft is kept unless a repair
   measurably reduces the defect count, so a bad repair cannot make things worse. */
async function auditAndRepair(svgText, req, onProgress){
  let current = svgText;
  let report = auditGeometry(current);
  const first = report.defects.length;
  let rounds = 0, repaired = 0;
  const log = [{round:0, defects:first, kinds:report.defects.map(d=>d.kind)}];

  while(report.defects.length && !report.broken && rounds < MAX_REPAIR_ROUNDS){
    if(onProgress) onProgress(rounds+1, report.defects.length);
    rounds++;
    let candidateText = '';
    try{
      candidateText = await repairSVG(current, report.defects, req);
    }catch(e){
      log.push({round:rounds, error:String(e.message||e).slice(0,160)});
      break;
    }
    const extracted = extractSvgCode(candidateText);
    if(!extracted.code || extracted.unterminated){
      log.push({round:rounds, error:'repair returned no complete SVG'});
      break;
    }
    const candidate = auditGeometry(extracted.code);
    log.push({round:rounds, defects:candidate.defects.length, kinds:candidate.defects.map(d=>d.kind)});
    if(candidate.broken || candidate.defects.length >= report.defects.length) break;
    current = extracted.code;
    report = candidate;
    repaired = rounds;
  }
  return {svg:current, audit:report, rounds, repaired, first, log};
}

function auditSummaryText(res){
  if(!res) return '';
  const left = res.audit.defects.length;
  if(res.first===0) return tt('audit.clean');
  if(res.repaired>0) return tt('audit.fixed',{a:res.first, b:left, r:res.repaired});
  if(left>0) return tt('audit.left',{n:left});
  return '';
}

function renderSVG(svg, usedVision, useIds, truncated, auditRes){
  const blob = new Blob([svg],{type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const n = (useIds||[...refs]).length;
  const auditNote = auditRes ? auditSummaryText(auditRes) : '';
  $('#out').style.display='block';
  $('#out').innerHTML = `<iframe sandbox src="${url}"></iframe>
    <div class="dl"><a class="btn-primary" href="${url}" download="figure-forge-draft.svg">${tt('svg.download')}</a>
    <span class="hint">${usedVision?tt('svg.hint1',{n:n}):tt('svg.hint2')}${truncated?tt('svg.trunc'):''}${auditNote}</span></div>`;
}

async function genOaiImage(base,model,key,content,p,refIds,layoutGuide){
  const useIds = refIds||[...refs];
  const tg = TARGETS[$('#target').value] || TARGETS.overview;
  const guide = layoutGuide
    ? `Follow this gallery-derived layout style guide precisely (panel division, arrows, palette, hierarchy):\n${layoutGuide}\n\n`
    : '';
  const imgPrompt = `${guide}${tg.img}. White background, flat modern scientific illustration style, elegant layout, minimal accurate labels. Paper content: ${content.slice(0,2000)}`;
  const body = {model, prompt:imgPrompt};
  if(p==='ark'){ body.size='2K'; body.response_format='b64_json'; }
  else if(p==='sf'){ body.image_size='1024x1024'; body.batch_size=1; }
  else if(p==='glm'){ body.size='1024x1024'; }
  else if(p==='oai'){ body.size='1536x1024'; }
  let usedRefs=false;
  if(useIds.length && p!=='glm'){
    const uris = await refDataURIs(useIds);
    body.image = (p==='sf') ? uris[0] : uris;
    usedRefs=true;
  }
  let r;
  try{ r = await postJSON(base,'/images/generations',body,key,undefined,300000); }
  catch(e){
    if(e.name==='TimeoutError') throw new Error(tt('img.timeout'));
    const diag=await diagnoseConnection(base,key,model,'image');
    throw new Error(diag || tt('svg.blocked'));
  }
  let txt = await r.text();
  if(!r.ok && usedRefs){
    delete body.image; usedRefs=false;
    try{ r = await postJSON(base,'/images/generations',body,key,undefined,300000); txt=await r.text(); }catch(e){}
  }
  if(!r.ok){
    if(r.status===404){
      // A hosted model manifest is only a suggestion: each user's provider
      // account may expose a different set of image models. Prefer the
      // account-specific diagnosis when /models is readable, then give a
      // concrete recovery path instead of the generic 404 message.
      let diag='';
      try{ diag=await diagnoseConnection(base,key,model,'image'); }catch{}
      if(diag && !diag.startsWith(tt('diag.generic'))) throw new Error(diag);
      throw new Error(tt('img.notfound',{m:model}));
    }
    throw new Error(friendlyHttp(r.status,txt));
  }
  const d = JSON.parse(txt);
  const item = d.data?.[0] || d.images?.[0];
  if(!item) throw new Error(tt('img.abnormal',{t:txt.slice(0,200)}));
  const imgSrc = item.url || ('data:image/png;base64,'+item.b64_json);
  $('#out').style.display='block';
  $('#out').innerHTML = `<img src="${esc(imgSrc)}" alt="draft">
    <div class="dl"><button class="btn-primary" id="dlImg">${tt('img.download')}</button>
    <span class="hint">${usedRefs?tt('img.hintRef',{n:useIds.length}):tt('img.hint')}</span></div>`;
  $('#dlImg').onclick = async ()=>{
    try{
      const rr = await fetch(imgSrc); const blob = await rr.blob();
      const u = URL.createObjectURL(blob);
      const a=document.createElement('a');
      const ext = blob.type.includes('webp')?'webp':blob.type.includes('jpeg')||blob.type.includes('jpg')?'jpg':'png';
      a.href=u; a.download='figure-forge-draft.'+ext; a.click();
    }catch(e){ window.open(imgSrc,'_blank'); }
  };
}
