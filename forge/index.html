function renderSVG(svg, usedVision, useIds, truncated, auditRes){
  const blob = new Blob([svg],{type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const n = (useIds||[...refs]).length;
  const auditNote = auditRes ? auditSummaryText(auditRes) : '';
  $('#out').style.display='block';
  $('#out').innerHTML = `<iframe sandbox></iframe>
    <div class="dl"><a class="btn-primary" href="${url}" download="figure-forge-draft.svg">${tt('svg.download')}</a>
    <span class="hint">${usedVision?tt('svg.hint1',{n:n}):tt('svg.hint2')}${truncated?tt('svg.trunc'):''}${auditNote}</span></div>`;
  const frame=$('#out iframe');
  if(frame) frame.srcdoc=svg;
  showEditableExportStep(svg);
}

async function genOaiImage(base,model,key,content,p,refIds,layoutGuide){
  const useIds = refIds||[...refs];
  const tg = TARGETS[$('#target').value] || TARGETS.overview;
  const guide = layoutGuide
    ? `Follow this gallery-derived layout style guide precisely (panel division, arrows, palette, hierarchy):\n${layoutGuide}\n\n`
    : '';
  const imgPrompt = `${guide}`
    + `${tg.img}. Publication-quality Figure 1 for a top-tier ML paper. `
    + `Include a prominent bold TITLE line running across the top of the figure, above all panels. `
    + `Below it, an information-rich composition of labelled sections. Let the CONTENT decide how `
    + `many sections there are and how wide each one is: three to five is common, but use as many as `
    + `the method really has, and size them by how much they hold rather than splitting the canvas `
    + `evenly. Each section carries its own bold header. `
    + `ORGANISE THE FIGURE IN LEVELS, the way a strong conference figure does. Three levels are typical: `
    + `the section container; inside it one or more grouping frames that hold a related cluster; and `
    + `inside those, module boxes. Put an illustration, a mini chart, a table, a formula, a photo `
    + `thumbnail or an icon inside a module box when the content calls for one. `
    + `FILL EVERY SECTION, BUT NEVER WITH COPIES. Each section's interior should be occupied by module `
    + `boxes, not left as a large empty area; what must not happen is filling it with near-identical `
    + `blocks. Make the contents of neighbouring boxes genuinely different in kind: an icon module, a `
    + `small chart or plot, a formula, a matrix or grid, a diagram fragment, a photo thumbnail, a `
    + `flow strip, a table. `
    + `Every element must earn its place by being relevant to THIS paper: take the modules and parts of `
    + `the reference figures as your vocabulary, but fill them with the components, variables, stages `
    + `and results that the paper content below actually describes. An element that could belong to any `
    + `paper is filler; an element that shows this method's own parts is content. `
    + `Keep the boxes tightly packed within a section, with even small gaps between them so the eye `
    + `separates them; the gaps belong between boxes, not as an empty region inside a section. `
    + `USE DASHED FRAMES FOR A REASON: an optional or future stage, an iterative loop, a repeated `
    + `group, or something outside the core method. A dashed frame that means nothing is worse than `
    + `no frame. `
    + `Keep the geometry square and orderly: axis-aligned rectangles with at most a slight corner `
    + `radius, even gaps between boxes, and crisp straight arrows. `
    + `USE COLOUR TO SEPARATE GROUPS — do not paint everything one tint. `
    + `Give each panel a DIFFERENT pale background tint, so the panels read apart at a glance. `
    + `Within a panel, give the module boxes fills that differ from each other and from the panel `
    + `behind them, drawn from the palette above; do not repeat a single fill for every box. `
    + `Let a saturated accent colour mark the one or two most important blocks, and keep grouping `
    + `frames lighter or neutral so the nested levels stay readable. Aim for the same colour variety `
    + `as the reference figures, where a reader can tell the panels and the individual modules apart `
    + `by fill alone. `
    + `Draw MANY borders: not one outline per panel, but a border around every module box inside it, `
    + `plus arrows and dashed grouping frames. Vary the border style — SOLID for concrete modules, `
    + `arrows and data-flow steps, DASHED for optional, repeated, conceptual or grouped blocks — so the `
    + `levels are obvious at a glance. `
    + `Arrows show the data flow between components, and they carry much of the structure: long `
    + `connectors that span the whole figure, dashed feedback loops that route back to an earlier `
    + `stage, and short arrows inside a group. Small elements may also sit OUTSIDE the main sections `
    + `— a legend, a partner or dataset icon, a training-loop inset at the side, a result thumbnail `
    + `beside its stage — which is how real figures keep their middle from looking stuffed. `
    + `Line weight and line style carry meaning here: draw each panel's outer container border clearly `
    + `THICKER than the module boxes inside it, and vary the strokes — dashed borders for optional, `
    + `conceptual or repeated blocks, solid borders for concrete modules — so groups stay distinct. `
    + `Faithfully FUSE the section division, colour palette, box shapes, border weights and arrow style `
    + `of the reference figures: mirror how much they put in each part, and how much they leave open. `
    + `White background, clean flat vector illustration, crisp aligned shapes, clearly readable short `
    + `English labels. `
    + `FINAL CHECK before you finish. Read the figure as a reviewer would. `
    + `Is any section still holding a large empty area? Fill it with further module boxes that show `
    + `this method's own parts. `
    + `Is any box a near-duplicate of its neighbour, or an element that could sit in any paper? `
    + `Replace it with a different kind of element that is specific to this method. `
    + `Can a reader name what every box contains by looking at it? If a box is generic, make it `
    + `concrete: name the variable, the stage, the metric or the component it stands for. `
    + `Does every dashed frame stand for something a reader could name? If not, make it solid or drop it. `
    + `Can a reader follow the flow from the arrows alone? Add a connector if a step is unclear. `
    + `Is the colour varied enough that sections and groups read apart, without turning garish? `
    + `The goal is a figure that is full, varied and specific to this paper — what a top-conference `
    + `reviewer would find clear and well judged. `
    + `Paper content: ${content.slice(0,2000)}`;
  const body = {model, prompt:imgPrompt};
  if(p==='ark'){ body.size='2K'; body.response_format='b64_json'; }
  else if(p==='sf'){ body.image_size='1024x1024'; body.batch_size=1; }
  else if(p==='glm'){ body.size='1024x1024'; }
  else if(p==='oai'){ body.size='1536x1024'; }
  let usedRefs=false;
  if(useIds.length && p!=='glm'){
    const uris = await refDataURIs(useIds);
    body.image = (p==='sf') ? uris[0] : uris;
    usedRefs=true;
  }
  let r;
  try{ r = await postJSON(base,'/images/generations',body,key,undefined,300000); }
  catch(e){
    if(e.name==='TimeoutError') throw new Error(tt('img.timeout'));
    const diag=await diagnoseConnection(base,key,model,'image');
    throw new Error(diag || tt('svg.blocked'));
  }
  let txt = await r.text();
  if(!r.ok && usedRefs){
    delete body.image; usedRefs=false;
    try{ r = await postJSON(base,'/images/generations',body,key,undefined,300000); txt=await r.text(); }catch(e){}
  }
  if(!r.ok){
    if(r.status===404){
      // A hosted model manifest is only a suggestion: each user's provider
      // account may expose a different set of image models. Prefer the
      // account-specific diagnosis when /models is readable, then give a
      // concrete recovery path instead of the generic 404 message.
      let diag='';
      try{ diag=await diagnoseConnection(base,key,model,'image'); }catch{}
      if(diag && !diag.startsWith(tt('diag.generic'))) throw new Error(diag);
      throw new Error(tt('img.notfound',{m:model}));
    }
    throw new Error(friendlyHttp(r.status,txt));
  }
  const d = JSON.parse(txt);
  const item = d.data?.[0] || d.images?.[0];
  if(!item) throw new Error(tt('img.abnormal',{t:txt.slice(0,200)}));
  const st = window.__ffExportState;
  const imgSrc = item.url || ('data:image/png;base64,'+item.b64_json);
  const exportImgSrc = item.b64_json ? `data:image/png;base64,${item.b64_json}` : imgSrc;
  $('#out').style.display='block';
  $('#out').innerHTML = `<img src="${esc(imgSrc)}" alt="draft">
    <div class="dl"><button class="btn-primary" id="dlImg">${tt('img.download')}</button>
    <span class="hint">${usedRefs?tt('img.hintRef',{n:useIds.length}):tt('img.hint')}</span></div>`;
  st.source = 'bitmap'; st.bitmap = exportImgSrc; st.recon = null;
  showEditableExportStep({ svg: rasterToExportSvg(exportImgSrc), source:'bitmap', bitmap: exportImgSrc });
  $('#dlImg').onclick = async ()=>{
    try{
      const rr = await fetch(imgSrc); const blob = await rr.blob();
      const u = URL.createObjectURL(blob);
      const a=document.createElement('a');
      const ext = blob.type.includes('webp')?'webp':blob.type.includes('jpeg')||blob.type.includes('jpg')?'jpg':'png';
      a.href=u; a.download='figure-forge-draft.'+ext; a.click();
    }catch(e){ window.open(imgSrc,'_blank'); }
  };
}
