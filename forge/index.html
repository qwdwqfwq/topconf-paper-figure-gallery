async function repairSVG(svgText, defects, req){
  const list = defects.map((d,i)=>`${i+1}. ${d.detail} -> ${d.fix}`).join('\n');
  const instruction =
`Fix ONLY the defects listed below. Change as little as possible: keep every panel, arrow, colour, position and label that is not named here.
Do not redesign, do not rename labels that are already correct, do not add or remove elements.
${list}

Return the complete corrected SVG only, no explanation, no code fences. Start with <svg and end with </svg>.`;
  const {base, model, key, provider} = req;
  if(req.anthropic){
    const body = {model, max_tokens:8192, temperature:0.1, system:SVG_SYS,
      messages:[{role:'user',content:[{type:'text',text:svgText},{type:'text',text:instruction}]}]};
    const r = await fetch(base.replace(/\/+$/,'')+'/v1/messages',{method:'POST',headers:anthropicHeaders(key),body:JSON.stringify(body)});
    const txt = await r.text();
    if(!r.ok) throw new Error(friendlyHttp(r.status, txt));
    const d = JSON.parse(txt);
    return (d.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  }
  const body = {model, temperature:0.1, max_tokens:8192,
    messages:[{role:'system',content:SVG_SYS},{role:'user',content:svgText+'\n\n'+instruction}]};
  if(provider==='ark') body.thinking={type:'disabled'};
  const r = await postJSON(base,'/chat/completions',body,key);
  const txt = await r.text();
  if(!r.ok) throw new Error(friendlyHttp(r.status, txt));
  const d = JSON.parse(txt);
  return d.choices?.[0]?.message?.content||'';
}

/* Extract the SVG from a model reply.
   When the reply was cut off, the old behaviour was to chop at the cut and glue a
   literal `</svg>` on, which often left a half-finished tag and a structurally
   broken document. Completing only the root element instead produces something
   well-formed: whatever partial element is dangling can no longer swallow the rest
   of the document, and the geometry audit then measures the real result. */
function extractSvgCode(raw, autoClose){
  const code = (raw.match(/<svg[\s\S]*?<\/svg>/)||[])[0] || '';
  if(code) return {code, truncated:false, completed:false};
  const s2 = raw.match(/<svg[\s\S]*$/);
  if(!s2) return {code:'', truncated:false, completed:false};
  let body = s2[0].replace(/```[\s\S]*$/,'').trim();
  if(autoClose){
    // Drop a trailing partial tag so the closing root element is valid markup.
    body = body.replace(/<[^>]*$/,'').trimEnd();
    body += '</svg>';
    return {code:body, truncated:true, completed:true};
  }
  return {code:body, truncated:true, completed:false};
}

/* Audit, then optionally repair. The current draft is kept unless a repair
   measurably reduces the defect count, so a bad repair cannot make things worse.
   A cut-off draft is measured but not repaired: a truncated figure is incomplete
   by definition, so the useful action is to say so, not to polish it. */
async function auditAndRepair(svgText, req, onProgress, wasTruncated){
  let current = svgText;
  let report = auditGeometry(current);
  const first = report.defects.length;
  let rounds = 0, repaired = 0;
  const log = [{round:0, defects:first, kinds:report.defects.map(d=>d.kind)}];

  while(!wasTruncated && report.defects.length && !report.broken && rounds < MAX_REPAIR_ROUNDS){
    if(onProgress) onProgress(rounds+1, report.defects.length);
    rounds++;
    let candidateText = '';
    try{
      candidateText = await repairSVG(current, report.defects, req);
    }catch(e){
      log.push({round:rounds, error:String(e.message||e).slice(0,160)});
      break;
    }
    const extracted = extractSvgCode(candidateText, false);
    if(!extracted.code || !extracted.completed && extracted.truncated){
      log.push({round:rounds, error:'repair returned no complete SVG'});
      break;
    }
    const candidate = auditGeometry(extracted.code);
    log.push({round:rounds, defects:candidate.defects.length, kinds:candidate.defects.map(d=>d.kind)});
    if(candidate.broken || candidate.defects.length >= report.defects.length) break;
    current = extracted.code;
    report = candidate;
    repaired = rounds;
  }
  // `truncated` here means "unfinished draft", regardless of which pass produced it.
  return {svg:current, audit:report, rounds, repaired, first, truncated:!!wasTruncated, log};
}

function auditSummaryText(res){
  if(!res) return '';
  const left = res.audit.defects.length;
  if(res.first===0) return tt('audit.clean');
  if(res.repaired>0) return tt('audit.fixed',{a:res.first, b:left, r:res.repaired});
  if(left>0) return tt('audit.left',{n:left});
  return '';
}

/* ---------------- Editable export step ----------------
   The SVG produced in step 3 already carries the two things an editable file
   needs: exact geometry, and labels as real <text> strings. So the export parses
   that SVG element by element and emits native shapes and text boxes for each
   target format. Two rules follow from that and both matter:

     1. Text is never re-recognised (no OCR, no bitmap tracing). The string in the
        SVG is copied verbatim, so the exported labels cannot be misspelled.
     2. Positions come from the measured SVG, not from a model's guess, so nothing
        drifts between the preview and the exported file.

   Bitmap drafts have neither property, so they take one extra step first: a vision
   model reads the image and returns a scene, which is then normalised, audited and
   written by exactly the same renderers. That step is what turns a bitmap into an
   editable figure, and it is the only place a model is involved at all.

   Everything below runs in the browser and works offline (PPTX uses the vendored
   PptxGenJS; draw.io and VSDX are written here). The only network call is the
   optional bitmap reconstruction, which is an explicit button, never automatic. */
window.__ffExportState = {svg:'', baseSvg:'', scene:null, target:'svg', font:'original', source:'svg', bitmap:'', recon:null};

/* ---------- canvas units ---------- */
const EXPORT_CANVAS = {w:1600, h:900};
// 1600 canvas units -> 10in wide figure, centred on a 13.333x7.5in 16:9 slide.
const PT_PER_UNIT = 0.45;

/* ---------- colour / unit helpers ---------- */
function svgColorToHex(value){
  if(!value) return null;
  let v = String(value).trim().toLowerCase();
  if(v==='none' || v==='transparent') return null;
  if(v==='currentcolor') return '000000';
  if(/^#[0-9a-f]{3}$/.test(v)) return v.slice(1).split('').map(c=>c+c).join('').toUpperCase();
  if(/^#[0-9a-f]{6}$/.test(v)) return v.slice(1).toUpperCase();
  if(/^#[0-9a-f]{8}$/.test(v)) return v.slice(1,7).toUpperCase();   // drop alpha
  const rgb = v.match(/^rgba?\(([^)]+)\)$/);
  if(rgb){
    const parts = rgb[1].split(/[,\s/]+/).filter(Boolean).map(Number);
    if(parts.length>=3 && parts.slice(0,3).every(n=>Number.isFinite(n))){
      if(parts.length>=4 && parts[3]===0) return null;
      return parts.slice(0,3).map(n=>Math.max(0,Math.min(255,Math.round(n))).toString(16).padStart(2,'0')).join('').toUpperCase();
    }
    return null;
  }
  const named = {black:'000000',white:'FFFFFF',red:'FF0000',green:'008000',blue:'0000FF',gray:'808080',grey:'808080',silver:'C0C0C0',orange:'FFA500',yellow:'FFFF00',purple:'800080',navy:'000080',teal:'008080',brown:'A52A2A',lightgray:'D3D3D3',lightgrey:'D3D3D3',darkgray:'A9A9A9'};
  return named[v] || null;
}

function parseTransformList(value){
  const ops = [];
  const re = /([a-zA-Z]+)\s*\(([^)]*)\)/g;
  let m;
  while((m = re.exec(value||''))){
    const nums = m[2].split(/[\s,]+/).filter(s=>s!=='').map(Number);
    if(nums.some(n=>!Number.isFinite(n))) continue;
    ops.push({fn:m[1].toLowerCase(), a:nums});
  }
  return ops;
}

function multiplyMatrix(m1, m2){   // m1 * m2, both [a,b,c,d,e,f]
  return [
    m1[0]*m2[0]+m1[2]*m2[1], m1[1]*m2[0]+m1[3]*m2[1],
    m1[0]*m2[2]+m1[2]*m2[3], m1[1]*m2[2]+m1[3]*m2[3],
    m1[0]*m2[4]+m1[2]*m2[5]+m1[4], m1[1]*m2[4]+m1[3]*m2[5]+m1[5],
  ];
}

function opsToMatrix(ops){
  let m = [1,0,0,1,0,0];
  ops.forEach(function(op){
    const a = op.a;
    let next = null;
    if(op.fn==='translate') next = [1,0,0,1, a[0]||0, a[1]||0];
    else if(op.fn==='scale'){ const sx=a[0]==null?1:a[0], sy=a[1]==null?sx:a[1]; next=[sx,0,0,sy,0,0]; }
    else if(op.fn==='rotate'){
      const t = (a[0]||0)*Math.PI/180, cos=Math.cos(t), sin=Math.sin(t);
      if(a.length>=3){
        const cx=a[1], cy=a[2];
        next = multiplyMatrix(multiplyMatrix([1,0,0,1,cx,cy],[cos,sin,-sin,cos,0,0]),[1,0,0,1,-cx,-cy]);
      } else next = [cos,sin,-sin,cos,0,0];
    }
    else if(op.fn==='matrix' && a.length>=6) next = a.slice(0,6);
    else if(op.fn==='skewx') next = [1,0,Math.tan((a[0]||0)*Math.PI/180),1,0,0];
    else if(op.fn==='skewy') next = [1,Math.tan((a[0]||0)*Math.PI/180),0,1,0,0];
    if(next) m = multiplyMatrix(m, next);
  });
  return m;
}

function styleOf(el){
  let s = {};
  try{ s = el.style || {}; }catch(_){ s = {}; }
  const pick = name => {
    const inline = s && s[name];
    if(inline) return inline;
    const attr = el.getAttribute(name);
    return attr || null;
  };
  return {
    fill: pick('fill'),
    stroke: pick('stroke'),
    strokeWidth: pick('stroke-width'),
    opacity: pick('opacity'),
    fillOpacity: pick('fill-opacity'),
    strokeOpacity: pick('stroke-opacity'),
    fontFamily: pick('font-family'),
    fontSize: pick('font-size'),
    fontWeight: pick('font-weight'),
    fontStyle: pick('font-style'),
    textAnchor: pick('text-anchor'),
    dominantBaseline: pick('dominant-baseline'),
  };
}

/* ---------- SVG -> scene ----------
   Returns every visual element with absolute canvas coordinates, measured where
   measurement is the only way to be correct (text width, and any element wrapped
   in a transform, which is flattened here so the output formats need no matrices). */
function parseSvgScene(svg){
  const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
  if(doc.querySelector('parsererror')) throw new Error('scene: SVG could not be parsed');
  const root = doc.documentElement;
  const vbRaw = (root.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
  const vb = (vbRaw.length===4 && vbRaw.every(Number.isFinite) && vbRaw[2]>0 && vbRaw[3]>0)
    ? vbRaw
    : [0,0, parseFloat(root.getAttribute('width'))||EXPORT_CANVAS.w, parseFloat(root.getAttribute('height'))||EXPORT_CANVAS.h];

  // A hidden host gives getBBox exact text metrics for the real font and size.
  const host = document.createElement('div');
  host.setAttribute('aria-hidden','true');
  host.style.cssText = 'position:fixed;left:-100000px;top:0;width:'+vb[2]+'px;height:'+vb[3]+'px;overflow:hidden;pointer-events:none;';
  const live = document.importNode(root, true);
  live.setAttribute('width', vb[2]); live.setAttribute('height', vb[3]);
  host.appendChild(live);
  document.body.appendChild(host);

  const nodes = [];
  const warnings = [];

  function applyMatrix(m, x, y){
    return { x: m[0]*x + m[2]*y + m[4], y: m[1]*x + m[3]*y + m[5] };
  }
  function isIdentity(m){
    return Math.abs(m[0]-1)<1e-6 && Math.abs(m[1])<1e-6 && Math.abs(m[2])<1e-6 &&
           Math.abs(m[3]-1)<1e-6 && Math.abs(m[4])<1e-6 && Math.abs(m[5])<1e-6;
  }

  function walk(el, matrix){
    const tag = (el.tagName||'').toLowerCase();
    const own = parseTransformList(el.getAttribute('transform'));
    const m = own.length ? multiplyMatrix(matrix, opsToMatrix(own)) : matrix;
    const st = styleOf(el);

    if(tag==='defs' || tag==='style' || tag==='title' || tag==='desc' || tag==='metadata') return;

    if(tag==='g' || tag==='svg'){
      [...el.children].forEach(child=>walk(child, m));
      return;
    }

    const num = (name, fallback) => {
      const raw = el.getAttribute(name);
      if(raw==null) return fallback;
      const v = parseFloat(raw);
      return Number.isFinite(v) ? v : fallback;
    };

    if(tag==='rect'){
      const x=num('x',0), y=num('y',0), w=num('width',0), h=num('height',0);
      if(w<=0 || h<=0) return;
      const corners = [applyMatrix(m,x,y), applyMatrix(m,x+w,y), applyMatrix(m,x,y+h)];
      const x0=Math.min(corners[0].x,corners[1].x,corners[2].x), y0=Math.min(corners[0].y,corners[1].y,corners[2].y);
      const x1=Math.max(corners[0].x,corners[1].x,corners[2].x), y1=Math.max(corners[0].y,corners[1].y,corners[2].y);
      const rot = Math.atan2(m[1], m[0]) * 180/Math.PI;
      const rx = (num('rx',0) || num('ry',0)) || 0;
      nodes.push({type:'rect', x:x0, y:y0, w:x1-x0, h:y1-y0, radius:rx,
        fill:svgColorToHex(st.fill), stroke:svgColorToHex(st.stroke),
        strokeWidth:parseFloat(st.strokeWidth)||0, rotate:Math.abs(rot)>0.01?rot:0});
      return;
    }

    if(tag==='circle' || tag==='ellipse'){
      const cx=num('cx',0), cy=num('cy',0);
      const rx = tag==='circle' ? num('r',0) : num('rx',0);
      const ry = tag==='circle' ? num('r',0) : num('ry',0);
      if(rx<=0 || ry<=0) return;
      const c = applyMatrix(m, cx, cy);
      const scaleX = Math.hypot(m[0], m[1]) || 1;
      const scaleY = Math.hypot(m[2], m[3]) || 1;
      nodes.push({type:'ellipse', x:c.x-rx*scaleX, y:c.y-ry*scaleY, w:rx*2*scaleX, h:ry*2*scaleY,
        fill:svgColorToHex(st.fill), stroke:svgColorToHex(st.stroke),
        strokeWidth:parseFloat(st.strokeWidth)||0});
      return;
    }

    if(tag==='line'){
      const p1 = applyMatrix(m, num('x1',0), num('y1',0));
      const p2 = applyMatrix(m, num('x2',0), num('y2',0));
      nodes.push({type:'line', x:p1.x, y:p1.y, x2:p2.x, y2:p2.y,
        stroke:svgColorToHex(st.stroke)||'000000', strokeWidth:parseFloat(st.strokeWidth)||1,
        arrow: !!el.getAttribute('marker-end')});
      return;
    }

    if(tag==='polygon' || tag==='polyline' || tag==='path'){
      const d = el.getAttribute('d');
      const pts = el.getAttribute('points');
      let bbox = null;
      try{ bbox = el.getBBox(); }catch(_){ bbox = null; }
      if(bbox && bbox.width>0 && bbox.height>0){
        const corners = [applyMatrix(m,bbox.x,bbox.y), applyMatrix(m,bbox.x+bbox.width,bbox.y),
                         applyMatrix(m,bbox.x,bbox.y+bbox.height), applyMatrix(m,bbox.x+bbox.width,bbox.y+bbox.height)];
        const xs=corners.map(c=>c.x), ys=corners.map(c=>c.y);
        nodes.push({type:tag==='polyline'?'polyline':'path',
          x:Math.min(...xs), y:Math.min(...ys),
          w:Math.max(...xs)-Math.min(...xs), h:Math.max(...ys)-Math.min(...ys),
          d:d||null, points:pts||null,
          fill:svgColorToHex(st.fill), stroke:svgColorToHex(st.stroke)||'000000',
          strokeWidth:parseFloat(st.strokeWidth)||1,
          arrow: !!el.getAttribute('marker-end'),
          matrix: isIdentity(m) ? null : m.slice(),
          closed: tag!=='polyline'});
      } else warnings.push(tag+' element without measurable bounds was skipped');
      return;
    }

    if(tag==='image'){
      const href = el.getAttribute('href') || el.getAttribute('xlink:href') || '';
      const x=num('x',0), y=num('y',0), w=num('width',0), h=num('height',0);
      if(!href) return;
      nodes.push({type:'image', x, y, w:w||vb[2], h:h||vb[3], href, matrix:isIdentity(m)?null:m.slice()});
      return;
    }

    if(tag==='text'){
      // tspan children with their own x/y are separate lines; otherwise the whole
      // string is one label and the parent's position is authoritative.
      const kids = [...el.children].filter(c=>(c.tagName||'').toLowerCase()==='tspan');
      const positioned = kids.filter(k=>k.getAttribute('x')!=null || k.getAttribute('y')!=null);
      if(positioned.length && positioned.length===kids.length && kids.length>1){
        kids.forEach(k=>emitText(k, m, st, el));
        return;
      }
      emitText(el, m, st, el);
      return;
    }

    // Unknown element types: recurse so nothing nested is lost.
    if(el.children && el.children.length) [...el.children].forEach(child=>walk(child, m));
  }

  function emitText(el, matrix, inherited, styleSource){
    const text = (el.textContent||'').replace(/\s+/g,' ').trim();
    if(!text) return;
    const st = Object.assign({}, inherited, styleOf(el));
    const base = styleSource || el;
    const xRaw = el.getAttribute('x')!=null ? parseFloat(el.getAttribute('x')) : parseFloat(base.getAttribute('x'));
    const yRaw = el.getAttribute('y')!=null ? parseFloat(el.getAttribute('y')) : parseFloat(base.getAttribute('y'));
    const x = Number.isFinite(xRaw) ? xRaw : 0;
    const y = Number.isFinite(yRaw) ? yRaw : 0;
    let fontSize = parseFloat(st.fontSize);
    if(!Number.isFinite(fontSize) || fontSize<=0) fontSize = 16;

    let box = null;
    try{ box = el.getBBox(); }catch(_){ box = null; }
    const scaleX = Math.hypot(matrix[0], matrix[1]) || 1;
    const scaleY = Math.hypot(matrix[2], matrix[3]) || 1;
    const width = box && box.width>0 ? box.width*scaleX : text.length*fontSize*0.58*scaleX;
    const height = box && box.height>0 ? box.height*scaleY : fontSize*1.25*scaleY;
    const anchor = (st.textAnchor||'start').toLowerCase();
    const effective = Object.assign({}, matrix);
    const pt = applyMatrix(effective, x, y);

    nodes.push({
      type:'text', text,
      x:pt.x, y:pt.y, w:width, h:height,
      fontSize: fontSize*scaleY,
      anchor,
      fill: svgColorToHex(st.fill) || '000000',
      fontFamily: st.fontFamily || null,
      bold: String(st.fontWeight||'').match(/^(bold|[6-9]00)$/) ? true : false,
      italic: String(st.fontStyle||'')==='italic',
      role: el.getAttribute('data-role') || null,
    });
  }

  try{
    walk(live, [1,0,0,1,0,0]);
  } finally {
    if(host.parentNode) host.parentNode.removeChild(host);
  }

  return {
    schema:'figureforge.scene.v2',
    canvas:{x:vb[0], y:vb[1], width:vb[2], height:vb[3], viewBox:vb.join(' ')},
    nodes,
    counts:{total:nodes.length, text:nodes.filter(n=>n.type==='text').length,
            shapes:nodes.filter(n=>n.type!=='text'&&n.type!=='image').length,
            images:nodes.filter(n=>n.type==='image').length},
    warnings,
  };
}

function escapeSvgAttr(value){
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
}
function xmlEscape(value){
  return String(value==null?'':value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[ch]));
}
function rasterToExportSvg(src){
  const href=escapeSvgAttr(src);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><image href="${href}" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid meet" data-role="raster-image"/></svg>`;
}
function downloadText(filename,text,type){
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadBlob(filename,blob){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function applyExportFont(font){
  const st=window.__ffExportState; if(!st.baseSvg) return;
  let svg=st.baseSvg;
  if(font!=='original'){
    const doc=new DOMParser().parseFromString(svg,'image/svg+xml');
    [...doc.querySelectorAll('text,tspan')].forEach(el=>{el.setAttribute('font-family',font); el.style.fontFamily=font;});
    svg=new XMLSerializer().serializeToString(doc);
  }
  st.font=font; st.svg=svg;
  try{ st.scene=parseSvgScene(svg); }catch(e){ st.scene=null; }
  renderEditableExportCard();
  if(window.__ffExportPreviewUrl) URL.revokeObjectURL(window.__ffExportPreviewUrl);
  window.__ffExportPreviewUrl=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  const frame=$('#out iframe'); if(frame) frame.srcdoc=svg;
}

/* ---------- PPTX ----------
   Native shapes and real text boxes, positioned from the measured scene, so the
   result is editable in PowerPoint without any redrawing step and the labels are
   the exact strings from the SVG. */
let pptxLibPromise = null;
function loadPptxGenJS(){
  if(window.PptxGenJS) return Promise.resolve(window.PptxGenJS);
  if(!pptxLibPromise){
    pptxLibPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      // The bundle build is used, not pptxgen.min.js: the minified file expects an
      // external JSZip, so loading it throws and never sets the global.
      s.src = 'vendor/pptxgen.bundle.js';
      s.onload = ()=> window.PptxGenJS ? resolve(window.PptxGenJS) : reject(new Error('PPTX library loaded but global missing'));
      s.onerror = ()=> reject(new Error('PPTX library could not be loaded (vendor/pptxgen.bundle.js)'));
      document.head.appendChild(s);
    });
  }
  return pptxLibPromise;
}

function pptxColor(hex){ return hex || null; }

function buildPptx(scene){
  const canvas = scene.canvas;
  const scale = 10 / canvas.width;                    // canvas units -> inches (10in wide)
  const slideW = 13.333, slideH = 7.5;
  const offX = (slideW - canvas.width*scale) / 2;
  const offY = (slideH - canvas.height*scale) / 2;
  const IN = v => v*scale;
  const pt = v => Math.max(1, Number(v||0) * PT_PER_UNIT);

  return loadPptxGenJS().then(function(PptxGenJS){
    const pres = new PptxGenJS();
    pres.defineLayout({ name:'FF169', width:slideW, height:slideH });
    pres.layout = 'FF169';
    const slide = pres.addSlide();
    slide.background = { color:'FFFFFF' };

    // background: only a full-canvas rect, so the slide is not over-painted
    scene.nodes.forEach(function(n){
      if(n.type!=='rect') return;
      if(n.fill) slide.addShape(pres.ShapeType.rect, { x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h), fill:{color:pptxColor(n.fill)} });
    });

    scene.nodes.forEach(function(n){
      if(n.type==='rect'){
        if(n.fill) return;                              // already painted as background
        const opts = { x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h),
                       fill:{ color:'FFFFFF', transparency:100 },
                       line:{ color:pptxColor(n.stroke)||'000000', width:pt(n.strokeWidth||1) } };
        if(n.radius>0){
          opts.rectRadius = Math.min(0.5, (n.radius/canvas.width)/scale*0.01 || 0.08);
          slide.addShape(pres.ShapeType.roundRect, opts);
        } else slide.addShape(pres.ShapeType.rect, opts);
        return;
      }
      if(n.type==='ellipse'){
        slide.addShape(pres.ShapeType.ellipse, {
          x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h),
          fill:n.fill?{color:pptxColor(n.fill)}:{color:'FFFFFF',transparency:100},
          line:{ color:pptxColor(n.stroke)||'000000', width:pt(n.strokeWidth||1) } });
        return;
      }
      if(n.type==='line'){
        const lineOpts = { x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.x2-n.x), h:IN(n.y2-n.y),
                           line:{ color:pptxColor(n.stroke)||'000000', width:pt(n.strokeWidth||1), beginArrowType:'none', endArrowType:n.arrow?'triangle':'none' } };
        if(Math.abs(n.y2-n.y) < 0.75) lineOpts.line.dashType = 'solid';
        slide.addShape(pres.ShapeType.line, lineOpts);
        return;
      }
      if(n.type==='path' || n.type==='polyline'){
        // Keep freeform geometry where it can be expressed; otherwise fall back to
        // a bounded outline so the element is still present and positionable.
        if(n.points){
          try{
            const raw = n.points.trim().split(/[\s,]+/).map(Number);
            const pts = [];
            for(let i=0;i+1<raw.length;i+=2) pts.push({x:offX+IN(raw[i]), y:offY+IN(raw[i+1])});
            if(pts.length>=2){
              slide.addShape(pres.ShapeType.custGeom ? pres.ShapeType.custGeom : pres.ShapeType.rect,
                { x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h),
                  fill:n.fill?{color:pptxColor(n.fill)}:{color:'FFFFFF',transparency:100},
                  line:{ color:pptxColor(n.stroke)||'000000', width:pt(n.strokeWidth||1) },
                  points:pts });
              return;
            }
          }catch(_){ /* fall through to outline */ }
        }
        slide.addShape(pres.ShapeType.rect, {
          x:offX+IN(n.x), y:offY+IN(n.y), w:Math.max(IN(n.w),0.02), h:Math.max(IN(n.h),0.02),
          fill:{ color:'FFFFFF', transparency:100 },
          line:{ color:'BFBFBF', width:0.75, dashType:'dash' } });
        return;
      }
      if(n.type==='image'){
        const uri = n.href||'';
        const m = uri.match(/^data:([^;]+);base64,(.*)$/);
        if(m){
          slide.addImage({ data:'data:'+m[1]+';base64,'+m[2], x:offX+IN(n.x), y:offY+IN(n.y), w:IN(n.w), h:IN(n.h) });
        }
        return;
      }
      if(n.type==='text'){
        const fontUnits = n.fontSize || 16;
        const boxW = Math.max(IN(n.w) + 0.06, 0.1);
        const boxH = Math.max(IN(fontUnits*1.45), 0.12);
        let left;
        if(n.anchor==='middle') left = offX + IN(n.x) - boxW/2;
        else if(n.anchor==='end') left = offX + IN(n.x) - boxW;
        else left = offX + IN(n.x);
        const top = offY + IN(n.y) - boxH/2;
        slide.addText(String(n.text), {
          x:left, y:top, w:boxW, h:boxH,
          align:'center', valign:'middle', margin:0,
          fontFace: n.fontFamily ? String(n.fontFamily).split(',')[0].replace(/["']/g,'') : 'Arial',
          fontSize: Math.max(4, fontUnits*PT_PER_UNIT),
          bold: !!n.bold, italic: !!n.italic,
          color: pptxColor(n.fill) || '000000',
          wrap:false, shrinkText:false, isTextBox:true,
        });
        return;
      }
    });

    return pres.write({ outputType:'blob', compression:true });
  });
}

/* ---------- draw.io ----------
   Emits real mxCell geometry, not an embedded picture, so every box and label is
   individually editable inside draw.io. This file can also be exported to VSDX
   from draw.io, which is the supported path to Visio. */
function sceneToDrawio(scene){
  const c = scene.canvas;
  const cells = [];
  let seq = 10;
  const nextId = ()=> 'ff' + (seq++);
  const xml = s => xmlEscape(s);

  scene.nodes.forEach(function(n){
    const id = nextId();
    if(n.type==='text'){
      const anchor = n.anchor==='middle' ? 'center' : (n.anchor==='end' ? 'right' : 'left');
      const style = 'text;html=1;strokeColor=none;fillColor=none;align='+anchor+';verticalAlign=middle;'+
                    'fontSize='+Math.round((n.fontSize||16)*0.75)+';fontColor=#'+(n.fill||'000000')+
                    (n.bold?';fontStyle=1':'')+(n.italic?';fontStyle=2':'')+';whiteSpace=wrap;';
      const w = Math.max(n.w*1.04, 8), h = Math.max((n.fontSize||16)*1.3, 8);
      const x = n.anchor==='middle' ? n.x - w/2 : (n.anchor==='end' ? n.x - w : n.x);
      cells.push('<mxCell id="'+id+'" value="'+xml(n.text)+'" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+Math.round(x)+'" y="'+Math.round(n.y - h/2)+'" width="'+Math.round(w)+'" height="'+Math.round(h)+'" as="geometry"/></mxCell>');
      return;
    }
    if(n.type==='line'){
      const style = 'endArrow='+(n.arrow?'classic':'none')+';html=1;strokeColor=#'+(n.stroke||'000000')+';strokeWidth='+(n.strokeWidth||1)+';';
      cells.push('<mxCell id="'+id+'" style="'+style+'" edge="1" parent="1">'+
                 '<mxGeometry relative="1" as="geometry"><mxPoint x="'+Math.round(n.x)+'" y="'+Math.round(n.y)+'" as="sourcePoint"/>'+
                 '<mxPoint x="'+Math.round(n.x2)+'" y="'+Math.round(n.y2)+'" as="targetPoint"/></mxGeometry></mxCell>');
      return;
    }
    if(n.type==='ellipse'){
      const style = 'ellipse;whiteSpace=wrap;html=1;fillColor=#'+(n.fill||'none')+';strokeColor=#'+(n.stroke||'000000')+';strokeWidth='+(n.strokeWidth||1)+';';
      cells.push('<mxCell id="'+id+'" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+Math.round(n.x)+'" y="'+Math.round(n.y)+'" width="'+Math.round(n.w)+'" height="'+Math.round(n.h)+'" as="geometry"/></mxCell>');
      return;
    }
    if(n.type==='rect'){
      const rounded = n.radius>0 ? 'rounded=1;arcSize='+Math.max(4, Math.min(50, Math.round(n.radius/Math.max(1,Math.min(n.w,n.h))*100)))+';' : '';
      const style = rounded+'whiteSpace=wrap;html=1;fillColor=#'+(n.fill||'none')+';strokeColor=#'+(n.stroke||'none')+';strokeWidth='+(n.strokeWidth||1)+';';
      cells.push('<mxCell id="'+id+'" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+Math.round(n.x)+'" y="'+Math.round(n.y)+'" width="'+Math.round(n.w)+'" height="'+Math.round(n.h)+'" as="geometry"/></mxCell>');
      return;
    }
    if(n.type==='path' || n.type==='polyline'){
      const style = 'shape=stencil;whiteSpace=wrap;html=1;fillColor=#'+(n.fill||'none')+';strokeColor=#'+(n.stroke||'000000')+';strokeWidth='+(n.strokeWidth||1)+';';
      cells.push('<mxCell id="'+id+'" value="" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+Math.round(n.x)+'" y="'+Math.round(n.y)+'" width="'+Math.round(Math.max(n.w,4))+'" height="'+Math.round(Math.max(n.h,4))+'" as="geometry"/></mxCell>');
      return;
    }
    if(n.type==='image'){
      const style = 'shape=image;imageAspect=0;aspect=fixed;image='+xmlEscape(n.href||'')+';';
      cells.push('<mxCell id="'+id+'" style="'+style+'" vertex="1" parent="1">'+
                 '<mxGeometry x="'+Math.round(n.x)+'" y="'+Math.round(n.y)+'" width="'+Math.round(n.w)+'" height="'+Math.round(n.h)+'" as="geometry"/></mxCell>');
      return;
    }
  });

  return '<?xml version="1.0" encoding="UTF-8"?>\n'+
    '<mxfile host="app.diagrams.net" agent="FigureForge" type="device">'+
    '<diagram id="figureforge" name="FigureForge">'+
    '<mxGraphModel dx="1600" dy="900" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="'+c.width+'" pageHeight="'+c.height+'" math="0" shadow="0">'+
    '<root><mxCell id="0"/><mxCell id="1" parent="0"/>'+cells.join('')+'</root>'+
    '</mxGraphModel></diagram></mxfile>';
}

/* ---------- VSDX ----------
   Minimal but valid Visio package: one page, native Rectangle / Ellipse / Line /
   Text shapes. Layout uses explicit PinX/PinY in inches, so shapes land exactly
   where the SVG had them.

   Honest limitation: this was written against the VSDX package structure and is
   delivered without a Visio installation to open it with, so treat it as a draft
   that PowerPoint-grade guarantees do not cover. draw.io's own VSDX export (from
   the .drawio file next to this one) is the validated alternative. */
function sceneToVsdxFiles(scene, font){
  const c = scene.canvas;
  const PX_PER_IN = c.width/10;                    // keep the same 10in width as PPTX
  const inches = v => (v/PX_PER_IN);
  const shapes = [];
  const media = [];                                // {name, bytes, contentType, ext}
  const mediaRels = [];                            // relationship entries for page1
  let mediaSeq = 0;

  function dataUriParts(uri){
    const m = /^data:(image\/(png|jpeg|jpg|gif|webp));base64,([A-Za-z0-9+/=\s]+)$/.exec(String(uri||'').trim());
    if(!m) return null;
    const mime = m[1].toLowerCase();
    const ext = mime === 'image/jpeg' || mime === 'image/jpg' ? 'jpeg' : mime.split('/')[1];
    let bin;
    try{ bin = atob(m[3].replace(/\s+/g,'')); }
    catch(_){ return null; }
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return { bytes, contentType:mime, ext };
  }

  /* Visio stores a bitmap shape as Type="Foreign" with a rectangle geometry, the
     Img* cells, and a <ForeignData> that points at a media part through a page
     relationship. This mirrors the structure Visio itself writes. */
  function imageShape(n, ID, parts, relId){
    const w = Math.max(n.w, 1), h = Math.max(n.h, 1);
    const iw = inches(w), ih = inches(h);
    return '<Shape ID="'+ID+'" Type="Foreign" LineStyle="0" FillStyle="0" TextStyle="0">'+
      '<Cell N="PinX" V="'+inches(n.x + w/2).toFixed(4)+'"/>'+
      '<Cell N="PinY" V="'+inches(c.height - (n.y + h/2)).toFixed(4)+'"/>'+
      '<Cell N="Width" V="'+iw.toFixed(4)+'" U="IN"/><Cell N="Height" V="'+ih.toFixed(4)+'" U="IN"/>'+
      '<Cell N="LocPinX" V="'+(iw/2).toFixed(4)+'" U="IN" F="Width*0.5"/>'+
      '<Cell N="LocPinY" V="'+(ih/2).toFixed(4)+'" U="IN" F="Height*0.5"/>'+
      '<Cell N="Angle" V="0"/><Cell N="FlipX" V="0"/><Cell N="FlipY" V="0"/><Cell N="ResizeMode" V="0"/>'+
      '<Cell N="ImgOffsetX" V="0" U="IN" F="ImgWidth*0"/><Cell N="ImgOffsetY" V="0" U="IN" F="ImgHeight*0"/>'+
      '<Cell N="ImgWidth" V="'+iw.toFixed(4)+'" U="IN" F="Width*1"/>'+
      '<Cell N="ImgHeight" V="'+ih.toFixed(4)+'" U="IN" F="Height*1"/>'+
      '<Cell N="ClippingPath" V="" F="&quot;&quot;" E="#N/A"/>'+
      '<Cell N="TxtPinX" V="'+(iw/2).toFixed(4)+'" U="IN" F="Width*0.5"/>'+
      '<Cell N="TxtPinY" V="0" U="IN" F="Height*0"/>'+
      '<Cell N="TxtWidth" V="'+iw.toFixed(4)+'" U="IN" F="Width*1"/>'+
      '<Cell N="TxtHeight" V="0" U="IN" F="Height*0"/>'+
      '<Cell N="TxtLocPinX" V="'+(iw/2).toFixed(4)+'" U="IN" F="TxtWidth*0.5"/>'+
      '<Cell N="TxtLocPinY" V="0" U="IN" F="TxtHeight*0.5"/>'+
      '<Cell N="TxtAngle" V="0"/><Cell N="VerticalAlign" V="0"/><Cell N="ShdwPattern" V="0"/>'+
      '<Section N="Geometry" IX="0">'+
        '<Cell N="NoFill" V="0"/><Cell N="NoLine" V="0"/><Cell N="NoShow" V="0"/>'+
        '<Cell N="NoSnap" V="0"/><Cell N="NoQuickDrag" V="0"/>'+
        '<Row T="RelMoveTo" IX="1"><Cell N="X" V="0"/><Cell N="Y" V="0"/></Row>'+
        '<Row T="RelLineTo" IX="2"><Cell N="X" V="1"/><Cell N="Y" V="0"/></Row>'+
        '<Row T="RelLineTo" IX="3"><Cell N="X" V="1"/><Cell N="Y" V="1"/></Row>'+
        '<Row T="RelLineTo" IX="4"><Cell N="X" V="0"/><Cell N="Y" V="1"/></Row>'+
        '<Row T="RelLineTo" IX="5"><Cell N="X" V="0"/><Cell N="Y" V="0"/></Row>'+
      '</Section>'+
      '<ForeignData ForeignType="Bitmap" CompressionType="'+parts.ext.toUpperCase()+'"><Rel r:id="'+relId+'"/></ForeignData>'+
      '</Shape>';
  }

  scene.nodes.forEach(function(n, idx){
    const ID = idx+1;
    const st = { fill:(n.fill||'none'), line:(n.stroke||'none'), weight:(n.strokeWidth||0) };
    let xml = '';
    if(n.type==='image'){
      const parts = dataUriParts(n.href);
      if(parts){
        mediaSeq++;
        const name = 'image' + mediaSeq + '.' + parts.ext;
        const relId = 'rIdImg' + mediaSeq;
        media.push({ name:'visio/media/'+name, bytes:parts.bytes });
        mediaRels.push({ id:relId, target:'../media/'+name });
        xml = imageShape(n, ID, parts, relId);
      } else {
        // A reference we cannot inline (a remote URL or a path the page cannot read):
        // keep the rectangle correct instead of pretending an image is there.
        xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
              '<Cell N="PinX" V="'+inches(n.x+n.w/2).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-(n.y+n.h/2)).toFixed(4)+'"/>'+
              '<Cell N="Width" V="'+inches(Math.max(n.w,4)).toFixed(4)+'"/><Cell N="Height" V="'+inches(Math.max(n.h,4)).toFixed(4)+'"/>'+
              '<Cell N="FillForegnd" V="#F3F4F6"/><Cell N="FillPattern" V="1"/>'+
              '<Cell N="LineColor" V="#9CA3AF"/><Cell N="LinePattern" V="2"/><Cell N="LineWeight" V="0.5"/>'+
              '<Cell N="ShapeType" V="Rectangle"/></Shape>';
      }
    } else if(n.type==='rect' || n.type==='ellipse'){
      const master = n.type==='ellipse' ? 'Ellipse' : 'Rectangle';
      xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
            '<Cell N="PinX" V="'+inches(n.x+n.w/2).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-(n.y+n.h/2)).toFixed(4)+'"/>'+
            '<Cell N="Width" V="'+inches(Math.max(n.w,1)).toFixed(4)+'"/><Cell N="Height" V="'+inches(Math.max(n.h,1)).toFixed(4)+'"/>'+
            '<Cell N="LocPinX" V="'+inches(Math.max(n.w,1)/2).toFixed(4)+'"/><Cell N="LocPinY" V="'+inches(Math.max(n.h,1)/2).toFixed(4)+'"/>'+
            fillCells(st)+
            '<Cell N="Rounding" V="'+(n.radius? inches(n.radius).toFixed(4) : '0')+'"/>'+
            '<Cell N="ShapeType" V="'+master+'"/>'+
            '</Shape>';
    } else if(n.type==='line'){
      const x1=n.x, y1=n.y, x2=n.x2, y2=n.y2;
      const len = Math.hypot(x2-x1, y2-y1);
      const ang = Math.atan2(-(y2-y1), x2-x1) * 180/Math.PI;
      xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
            '<Cell N="PinX" V="'+inches((x1+x2)/2).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-(y1+y2)/2).toFixed(4)+'"/>'+
            '<Cell N="Width" V="'+inches(Math.max(len,0.5)).toFixed(4)+'"/><Cell N="Height" V="0"/>'+
            '<Cell N="LocPinX" V="'+inches(Math.max(len,0.5)/2).toFixed(4)+'"/><Cell N="LocPinY" V="0"/>'+
            '<Cell N="Angle" V="'+ang.toFixed(4)+'"/>'+
            '<Cell N="EndArrow" V="'+(n.arrow?4:0)+'"/>'+
            '<Cell N="LineColor" V="'+(n.stroke? '#'+n.stroke : '#000000')+'"/>'+
            '<Cell N="LineWeight" V="'+(inches(Math.max(n.strokeWidth||1,1))*72).toFixed(3)+'"/>'+
            '<Cell N="ShapeType" V="Line"/>'+
            '</Shape>';
    } else if(n.type==='text'){
      const text = String(n.text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const sizePt = (n.fontSize||16)*PT_PER_UNIT;
      const boxW = Math.max(n.w*1.04, 20), boxH = (n.fontSize||16)*1.4;
      const anchorX = n.anchor==='middle' ? n.x : (n.anchor==='end' ? n.x - boxW/2 : n.x + boxW/2);
      xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
            '<Cell N="PinX" V="'+inches(anchorX).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-n.y).toFixed(4)+'"/>'+
            '<Cell N="Width" V="'+inches(boxW).toFixed(4)+'"/><Cell N="Height" V="'+inches(boxH).toFixed(4)+'"/>'+
            '<Cell N="LocPinX" V="'+inches(boxW/2).toFixed(4)+'"/><Cell N="LocPinY" V="'+inches(boxH/2).toFixed(4)+'"/>'+
            '<Cell N="FillForegnd" V="#FFFFFF"/><Cell N="FillPattern" V="0"/>'+
            '<Cell N="LinePattern" V="0"/>'+
            '<Cell N="VerticalAlign" V="1"/><Cell N="HorzAlign" V="'+(n.anchor==='middle'?1:(n.anchor==='end'?2:0))+'"/>'+
            '<Cell N="ShapeType" V="Text"/>'+
            '<Section N="Character"><Row IX="0"><Cell N="Size" V="'+sizePt.toFixed(2)+'"/>'+
              '<Cell N="Color" V="#'+(n.fill||'000000')+'"/><Cell N="Style" V="'+(n.bold?1:0)+'"/>'+
              '<Cell N="Font" V="'+(font||'Arial')+'"/></Row></Section>'+
            '<Text>'+text+'</Text>'+
            '</Shape>';
    } else {
      // Unsupported primitive: keep a dashed placeholder so nothing silently vanishes.
      xml = '<Shape ID="'+ID+'" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">'+
            '<Cell N="PinX" V="'+inches(n.x+n.w/2).toFixed(4)+'"/><Cell N="PinY" V="'+inches(c.height-(n.y+n.h/2)).toFixed(4)+'"/>'+
            '<Cell N="Width" V="'+inches(Math.max(n.w,4)).toFixed(4)+'"/><Cell N="Height" V="'+inches(Math.max(n.h,4)).toFixed(4)+'"/>'+
            '<Cell N="FillPattern" V="0"/><Cell N="LinePattern" V="2"/>'+
            '<Cell N="LineColor" V="#BFBFBF"/>'+
            '<Cell N="ShapeType" V="Rectangle"/></Shape>';
    }
    shapes.push(xml);
  });

  function fillCells(st){
    const parts = [];
    parts.push('<Cell N="FillForegnd" V="'+(st.fill && st.fill!=='none' ? '#'+st.fill : '#FFFFFF')+'"/>');
    parts.push('<Cell N="FillPattern" V="'+(st.fill && st.fill!=='none' ? 1 : 0)+'"/>');
    parts.push('<Cell N="LineColor" V="'+(st.line && st.line!=='none' ? '#'+st.line : '#000000')+'"/>');
    parts.push('<Cell N="LinePattern" V="'+(st.line && st.line!=='none' ? 1 : 0)+'"/>');
    parts.push('<Cell N="LineWeight" V="'+(inches(Math.max(st.weight,1))*72).toFixed(3)+'"/>');
    return parts.join('');
  }

  const pageWidth = inches(c.width).toFixed(4), pageHeight = inches(c.height).toFixed(4);

  // The page part is a PageContents document holding the shapes. The drawing-level
  // VisioDocument, its page list and the page properties live in the other parts.
  const pageXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<PageContents xmlns="http://schemas.microsoft.com/office/visio/2012/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xml:space="preserve">'+
    '<Shapes>'+shapes.join('')+'</Shapes>'+
    '</PageContents>';

  const pageRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    mediaRels.map(r=>'<Relationship Id="'+r.id+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="'+r.target+'"/>').join('')+
    '</Relationships>';

  const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    (media.some(m=>/\.png$/i.test(m.name)) ? '<Default Extension="png" ContentType="image/png"/>' : '')+
    (media.some(m=>/\.jpe?g$/i.test(m.name)) ? '<Default Extension="jpeg" ContentType="image/jpeg"/>' : '')+
    (media.some(m=>/\.gif$/i.test(m.name)) ? '<Default Extension="gif" ContentType="image/gif"/>' : '')+
    (media.some(m=>/\.webp$/i.test(m.name)) ? '<Default Extension="webp" ContentType="image/webp"/>' : '')+
    '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'+
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'+
    '<Override PartName="/visio/document.xml" ContentType="application/vnd.ms-visio.drawing.main+xml"/>'+
    '<Override PartName="/visio/pages/pages.xml" ContentType="application/vnd.ms-visio.pages+xml"/>'+
    '<Override PartName="/visio/pages/page1.xml" ContentType="application/vnd.ms-visio.page+xml"/>'+
    '<Override PartName="/visio/windows.xml" ContentType="application/vnd.ms-visio.windows+xml"/>'+
    '</Types>';

  const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.microsoft.com/visio/2010/relationships/document" Target="visio/document.xml"/>'+
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>'+
    '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'+
    '</Relationships>';

  const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.microsoft.com/visio/2010/relationships/pages" Target="pages/pages.xml"/>'+
    '<Relationship Id="rId2" Type="http://schemas.microsoft.com/visio/2010/relationships/windows" Target="windows.xml"/>'+
    '</Relationships>';

  const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<VisioDocument xmlns="http://schemas.microsoft.com/office/visio/2012/main" xml:space="preserve">'+
    '<DocumentSettings TopPage="0" DefaultTextStyle="0" DefaultLineStyle="0" DefaultFillStyle="0"/>'+
    '<Colors/><FaceNames/><StyleSheets/>'+
    '</VisioDocument>';

  const pagesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Pages xmlns="http://schemas.microsoft.com/office/visio/2012/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xml:space="preserve">'+
    '<Page ID="0" NameU="FigureForge" Name="FigureForge" ViewScale="-1" ViewCenterX="'+(c.width/2/PX_PER_IN).toFixed(4)+'" ViewCenterY="'+(c.height/2/PX_PER_IN).toFixed(4)+'">'+
    '<PageSheet LineStyle="0" FillStyle="0" TextStyle="0">'+
      '<Cell N="PageWidth" V="'+pageWidth+'" U="IN"/><Cell N="PageHeight" V="'+pageHeight+'" U="IN"/>'+
      '<Cell N="PageScale" V="1"/><Cell N="DrawingScale" V="1"/>'+
    '</PageSheet>'+
    '<Rel r:id="rId1"/>'+
    '</Page></Pages>';

  const pagesRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.microsoft.com/visio/2010/relationships/page" Target="page1.xml"/>'+
    '</Relationships>';

  const windowsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Windows xmlns="http://schemas.microsoft.com/office/visio/2012/main" ClientWidth="1600" ClientHeight="900"/>';

  const appXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties">'+
    '<Application>FigureForge</Application><Company></Company></Properties>';

  const coreXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" '+
    'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">'+
    '<dc:title>FigureForge editable figure</dc:title><dc:creator>FigureForge</dc:creator>'+
    '<cp:lastModifiedBy>FigureForge</cp:lastModifiedBy>'+
    '<dcterms:created xsi:type="dcterms:W3CDTF">'+new Date().toISOString()+'</dcterms:created>'+
    '</cp:coreProperties>';

  return [
    { name:'[Content_Types].xml', data:contentTypes },
    { name:'_rels/.rels', data:rootRels },
    { name:'docProps/app.xml', data:appXml },
    { name:'docProps/core.xml', data:coreXml },
    { name:'visio/document.xml', data:documentXml },
    { name:'visio/_rels/document.xml.rels', data:docRels },
    { name:'visio/pages/pages.xml', data:pagesXml },
    { name:'visio/pages/_rels/pages.xml.rels', data:pagesRels },
    { name:'visio/pages/page1.xml', data:pageXml },
    { name:'visio/pages/_rels/page1.xml.rels', data:pageRels },
    { name:'visio/windows.xml', data:windowsXml },
  ].concat(media.map(m=>({ name:m.name, data:m.bytes })));
}

/* ---------- zip (stored, no compression) ----------
   VSDX is an OOXML package, so a minimal store-only zip writer is enough and
   keeps this dependency-free. CRC32 is required by the format. */
function crc32(bytes){
  let table = crc32.table;
  if(!table){
    table = crc32.table = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function zipStore(files){
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours()<<11) | (now.getMinutes()<<5) | Math.floor(now.getSeconds()/2)) & 0xFFFF;
  const dosDate = (((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate()) & 0xFFFF;

  files.forEach(function(f){
    const nameBytes = enc.encode(f.name);
    const dataBytes = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(dataBytes);
    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0, true);
    lv.setUint16(8, 0, true);            // stored
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, dataBytes.length, true);
    lv.setUint32(22, dataBytes.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    chunks.push(local, dataBytes);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, dataBytes.length, true);
    cv.setUint32(24, dataBytes.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += local.length + dataBytes.length;
  });

  const centralSize = central.reduce((a,c)=>a+c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  return new Blob(chunks.concat(central, [end]), { type:'application/vnd.ms-visio.drawing' });
}

/* ---------- text-free base -> editable scene ----------
   The image model is asked to draw the figure with empty label areas, because a
   model that paints letters as pictures is what produces garbled labels. Here the
   label boxes are found by local pixel analysis (no API), the wording is taken from
   the paper, and the text is drawn as real SVG <text>. Everything downstream — the
   preview, the geometry audit and the four exporters — then works on real shapes
   and real strings. */
const RECON_SCHEMA = 'figureforge.recon.v2';

function bitmapToDataUrl(src){
  return /^data:image\//.test(String(src||'')) ? String(src) : null;
}

function loadImage(dataUrl){
  return new Promise(function(resolve, reject){
    const im = new Image();
    im.onload = function(){ resolve(im); };
    im.onerror = function(){ reject(new Error('image decode failed')); };
    im.src = dataUrl;
  });
}

/* Flood fill the light pixels and keep regions that are large, bounded and roughly
   rectangular. Empty label areas come out as single regions with a high fill ratio;
   areas holding an illustration come out with a lower one. */
/* Find label anchors by looking at content rather than at blank boxes.
   A blank box is only detectable when a dark border encloses it, which is exactly
   what the layered layout avoids: boxes are packed and the reserved bands are open to
   the background. So instead: find the content blocks, then anchor a label in the
   blank band above and below each block. */
function detectContentBlocks(canvas){
  const w = canvas.width, h = canvas.height;
  const img = canvas.getContext('2d', { willReadFrequently:true }).getImageData(0,0,w,h).data;
  const N = w*h;
  const isContent = function(i){
    const o = i*4, r = img[o], g = img[o+1], b = img[o+2];
    // anything that is not near-white counts as content
    return !(r > 228 && g > 228 && b > 228);
  };
  const seen = new Uint8Array(N);
  const blocks = [];
  const stack = [];
  const minPixels = Math.max(400, Math.round(N * 0.0004));
  for(let start = 0; start < N; start++){
    if(seen[start] || !isContent(start)) continue;
    stack.length = 0; stack.push(start); seen[start] = 1;
    let count = 0, minX = w, maxX = -1, minY = h, maxY = -1;
    while(stack.length){
      const p = stack.pop();
      const x = p % w, y = (p - x) / w;
      count++;
      if(x < minX) minX = x;
      if(x > maxX) maxX = x;
      if(y < minY) minY = y;
      if(y > maxY) maxY = y;
      if(x > 0   && !seen[p-1] && isContent(p-1)){ seen[p-1] = 1; stack.push(p-1); }
      if(x < w-1 && !seen[p+1] && isContent(p+1)){ seen[p+1] = 1; stack.push(p+1); }
      if(y > 0   && !seen[p-w] && isContent(p-w)){ seen[p-w] = 1; stack.push(p-w); }
      if(y < h-1 && !seen[p+w] && isContent(p+w)){ seen[p+w] = 1; stack.push(p+w); }
    }
    if(count < minPixels) continue;
    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    if(bw < 30 || bh < 20) continue;
    if(bw > w * 0.95 && bh > h * 0.95) continue;   // the page frame itself
    blocks.push({ x:minX, y:minY, w:bw, h:bh, area:count });
  }
  return blocks;
}

/* Turn content blocks into candidate label anchors: the blank band directly under a
   block (a box label) and the blank band directly above it (often a panel title). */
function labelAnchorsFromBlocks(blocks, w, h){
  const anchors = [];
  blocks.forEach(function(b){
    const below = { x:b.x, y:b.y + b.h + 4, w:b.w, h:Math.max(22, Math.min(38, Math.round(b.h * 0.16))) };
    if(below.y + below.h < h - 2) anchors.push(below);
    const above = { x:b.x, y:b.y - Math.max(22, Math.min(38, Math.round(b.h * 0.16))) - 4,
                    w:b.w, h:Math.max(22, Math.min(38, Math.round(b.h * 0.16))) };
    if(above.y > 2) anchors.push(above);
  });
  return anchors;
}

/* Slide a label box to the nearest position whose pixels are actually blank, so text
   never sits on top of an illustration. Returns the adjusted box, or the input when no
   blank spot is within reach. */
function snapToBlankPixels(canvas, box){
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d', { willReadFrequently:true });
  const bw = Math.max(20, Math.round(box.w)), bh = Math.max(16, Math.round(box.h));
  const maxShift = 46;
  const blankRatio = function(x0, y0){
    const x = Math.max(0, Math.min(w - 1, Math.round(x0)));
    const y = Math.max(0, Math.min(h - 1, Math.round(y0)));
    const cw = Math.min(bw, w - x), ch = Math.min(bh, h - y);
    if(cw < 6 || ch < 6) return -1;
    const d = ctx.getImageData(x, y, cw, ch).data;
    let light = 0, total = cw * ch;
    for(let i = 0; i < total; i++){
      const o = i*4;
      if(d[o] > 228 && d[o+1] > 228 && d[o+2] > 228) light++;
    }
    return light / total;
  };
  let best = null, bestScore = -1;
  for(let dy = -maxShift; dy <= maxShift; dy += 6){
    for(let dx = -maxShift; dx <= maxShift; dx += 6){
      const ratio = blankRatio(box.x + dx, box.y + dy);
      if(ratio < 0) continue;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const score = ratio - dist / (maxShift * 12);
      if(score > bestScore){ bestScore = score; best = { x:box.x + dx, y:box.y + dy }; }
    }
  }
  if(!best) return box;
  return { x:best.x, y:best.y, w:bw, h:bh };
}

/* Which wording goes in which box is decided by position, because the wording comes
   from the paper, not from a model reading the pixels. The vision model only names
   the regions it was shown, in order. */
function assignLabelsToRegions(regions, labels){
  const boxes = regions.slice(0, labels.length);
  const sorted = boxes.slice().sort(function(a,b){
    if(Math.abs(a.y - b.y) > 60) return a.y - b.y;
    return a.x - b.x;
  });
  return sorted.map(function(r, i){
    return { region:r, text:(labels[i]==null ? '' : String(labels[i])).trim() };
  }).filter(function(x){ return x.text; });
}

function reconPrompt(n){
  return 'You are given ' + n + ' blank label areas detected in a scientific figure, in reading order '
    + '(left to right, top to bottom). Each entry gives its position, in pixels, on a 1600x900 canvas. '
    + 'For EACH area, decide the short English label (1-4 words) that belongs there, judged from the '
    + 'paper content and from that area position relative to the figure. '
    + 'Use wording that appears in the paper; never invent unrelated terms. '
    + 'A blank area at the very top of a panel is usually a panel title (2-4 words, capitalised). '
    + 'A narrow blank area just under a box is that box label. '
    + 'Return STRICT JSON only, no commentary: '
    + '{"labels":[{"text":"Input Encoder","x":0,"y":0,"w":0,"h":0}]} '
    + 'with exactly ' + n + ' entries, in the same order as given. '
    + 'x/y/w/h are your best estimate in pixels on the 1600x900 canvas; a rough estimate is enough.';
}

/* Build a scene whose shapes carry the base bitmap and whose text is real text. */
function buildReconScene(baseCanvas, placed, paperText){
  const W = baseCanvas.width, H = baseCanvas.height;
  const nodes = [];
  nodes.push({ id:'bg', type:'image', x:0, y:0, w:W, h:H, href: baseCanvas.toDataURL('image/png') });
  placed.forEach(function(item, i){
    const r = item.region;
    // a text box anchored at the top-left of the detected area, with a little padding
    const pad = 4;
    const fontSize = Math.max(14, Math.min(34, Math.round(r.h * 0.26)));
    nodes.push({
      id: 'label' + (i+1),
      type: 'text',
      x: r.x + pad,
      y: r.y + pad + fontSize,
      w: Math.max(r.w - pad*2, 20),
      h: fontSize * 1.35,
      text: item.text,
      fontSize: fontSize,
      fill: '111827',
      anchor: 'start',
      bold: false,
    });
  });
  return { schema:'figureforge.scene.v3', canvas:{ w:W, h:H },
           nodes:nodes, counts:{ shapes:1, text:placed.length } };
}

function sceneToSvgString(scene){
  const c = scene.canvas;
  const parts = ['<?xml version="1.0" encoding="UTF-8"?>',
    '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ' +
    'viewBox="0 0 ' + c.w + ' ' + c.h + '" width="' + c.w + '" height="' + c.h + '">',
    '<rect x="0" y="0" width="' + c.w + '" height="' + c.h + '" fill="#ffffff"/>'];
  scene.nodes.forEach(function(n, i){
    const id = n.id || ('n' + i);
    if(n.type === 'image'){
      parts.push('<image id="' + id + '" data-role="base" data-editable="true" x="' + n.x + '" y="' + n.y +
        '" width="' + n.w + '" height="' + n.h + '" xlink:href="' + n.href + '"/>');
    } else if(n.type === 'text'){
      parts.push('<text id="' + id + '" data-role="label" data-editable="true" x="' + n.x + '" y="' + n.y +
        '" font-family="Arial, Helvetica, sans-serif" font-size="' + n.fontSize +
        '" fill="#' + (n.fill || '111827') + '"' + (n.bold ? ' font-weight="bold"' : '') + '>' +
        xmlEscape(n.text) + '</text>');
    }
  });
  parts.push('</svg>');
  return parts.join('\n');
}

/* The whole step: find the label areas, ask for their wording, draw the text, and
   hand the result to the existing export path. */
async function runReconstruction(){
  const st = window.__ffExportState;
  const status = $('#reconStatus');
  const say = function(k, vars){ if(status) status.textContent = tt(k, vars); };
  const src = bitmapToDataUrl(st.bitmap);
  if(!src){ say('recon.nobitmap'); return false; }
  try{
    say('recon.reading');
    const im = await loadImage(src);
    const canvas = document.createElement('canvas');
    canvas.width = im.naturalWidth || im.width;
    canvas.height = im.naturalHeight || im.height;
    canvas.getContext('2d').drawImage(im, 0, 0);
    const blocks = detectContentBlocks(canvas);
    const anchors = labelAnchorsFromBlocks(blocks, canvas.width, canvas.height);
    if(!anchors.length){ say('recon.noboxes'); return false; }

    say('recon.labelling', { n: anchors.length });
    const labels = await requestRegionLabels(anchors, canvas);
    // Prefer the model's own position, snapped onto a blank region. If the model gave
    // no position, fall back to reading order against the detected regions.
    const placed = [];
    const taken = [];
    labels.forEach(function(lb, i){
      if(!lb.text) return;
      // The model may suggest a position; otherwise keep the anchor it belongs to.
      const anchor = anchors[i] || anchors[0];
      const wanted = (lb.x || lb.y) ? { x:lb.x, y:lb.y, w:lb.w || anchor.w, h:lb.h || anchor.h } : anchor;
      const overUses = taken.filter(function(p){
        return Math.abs(p.x - wanted.x) < 12 && Math.abs(p.y - wanted.y) < 12;
      }).length;
      if(overUses) return;
      const finalBox = snapToBlankPixels(canvas, wanted);
      taken.push(finalBox);
      placed.push({ region:finalBox, text:lb.text });
    });
    if(!placed.length){ say('recon.notext'); return false; }

    const scene = buildReconScene(canvas, placed, $('#paper') ? $('#paper').value : '');
    const svg = sceneToSvgString(scene);
    const audit = auditReconScene(scene);
    Object.assign(st, { scene:scene, svg:svg, baseSvg:svg, source:'bitmap',
                       recon:{ anchors:anchors.length, labels:placed.length, audit:audit } });
    renderEditableExportCard();
    applyExportFont(st.font || 'original');
    say(audit.defects.length ? 'recon.audit' : 'recon.done',
        { n: placed.length, d: audit.defects.length });
    return true;
  }catch(err){
    console.warn('reconstruction failed', err);
    const msg = String(err && err.message || err);
    say(msg && msg.length < 200 ? 'recon.failedDetail' : 'recon.failed', { msg: msg });
    return false;
  }
}

/* Only the wording is requested here; nothing is painted from these strings. */
async function requestRegionLabels(regions, canvas){
  const cfgv = cfg(), relay = $('#baseOverride').value.trim();
  const paper = (($('#paper') && $('#paper').value) || '').slice(0, 2500);
  const list = regions.slice(0, 24).map(function(r, i){
    const place = (r.y < 160) ? 'top of the figure' : (r.w > 300 ? 'wide band, likely a panel title' : 'narrow strip, likely a box label');
    return (i+1) + '. ' + r.w + 'x' + r.h + ' px at (' + r.x + ',' + r.y + ') — ' + place;
  }).join('\n');
  const prompt = reconPrompt(regions.slice(0,24).length) + '\n\nDetected areas:\n' + list +
    '\n\nPaper content:\n' + paper;
  const model = ($('#analyzeModel') && $('#analyzeModel').value) || $('#model').value;
  if(!model) throw new Error(tt('analyze.needmodel'));

  let txt;
  if(cfgv.proto === 'anthropic' && !relay){
    const body = { model:model, max_tokens:1200, system:ANALYZE_SYS,
                   messages:[{ role:'user', content:[{ type:'text', text:prompt }] }] };
    const r = await fetch(baseURL() + '/v1/messages',
      { method:'POST', headers:anthropicHeaders(cleanKey($('#key').value)), body:JSON.stringify(body) });
    txt = await r.text();
    if(!r.ok) throw new Error(friendlyHttp(r.status, txt));
    const d = JSON.parse(txt);
    txt = (d.content||[]).filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('');
  }else{
    const body = { model:model, temperature:0.2,
                   messages:[{ role:'system', content:ANALYZE_SYS },
                             { role:'user', content:prompt }] };
    if($('#provider').value === 'ark') body.thinking = { type:'disabled' };
    const r = await postJSON(baseURL(), '/chat/completions', body, cleanKey($('#key').value));
    txt = await r.text();
    if(!r.ok) throw new Error(friendlyHttp(r.status, txt));
    const d = JSON.parse(txt);
    txt = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '';
  }
  let j;
  try{ j = extractJSON(txt); }
  catch(err){ throw new Error(tt('recon.badjson')); }
  const raw = Array.isArray(j && j.labels) ? j.labels : [];
  // accept both the object form and a plain list of strings
  return raw.map(function(item){
    if(item && typeof item === 'object'){
      return { text:String(item.text || '').replace(/[\r\n]+/g,' ').slice(0, 48),
               x:Number(item.x) || 0, y:Number(item.y) || 0,
               w:Number(item.w) || 0, h:Number(item.h) || 0 };
    }
    return { text:String(item || '').replace(/[\r\n]+/g,' ').slice(0, 48), x:0, y:0, w:0, h:0 };
  });
}

/* Deterministic checks on the reconstructed scene, so a broken result is caught
   here rather than in Visio or PowerPoint. */
function auditReconScene(scene){
  const c = scene.canvas, defects = [];
  const text = scene.nodes.filter(function(n){ return n.type === 'text'; });
  text.forEach(function(n){
    if(n.x < 0 || n.y < 0 || n.x + n.w > c.w || n.y > c.h){
      defects.push({ id:n.id, kind:'out-of-canvas' });
    }
    if(!n.text || !n.text.trim()) defects.push({ id:n.id, kind:'empty-label' });
  });
  // overlapping label boxes are a layout bug worth reporting
  for(let i=0;i<text.length;i++){
    for(let j=i+1;j<text.length;j++){
      const a = text[i], b = text[j];
      const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
      const oy = Math.min(a.y, a.y + a.h) - Math.max(a.y, b.y);
      if(ox > 2 && oy > 2) defects.push({ id:a.id + '+' + b.id, kind:'overlap' });
    }
  }
  return { ok: defects.length === 0, defects: defects };
}

function renderEditableExportCard(){
  // The card is always visible so the four-step flow is legible, but until a draft exists
  // it is shown locked: the format buttons are disabled and the status line says what to do
  // first. Hiding the whole card made step 4 look missing.
  const card=$('#card4'), state=window.__ffExportState;
  if(!card) return;
  const locked = !state.svg;
  card.classList.toggle('export-locked', locked);
  const font=$('#exportFont'); if(font) font.value=state.font||'original';
  // Only a bitmap draft needs the rebuild panel: that is the case where the export
  // would otherwise carry a picture instead of editable text.
  const box=$('#exportRecon'); if(box) box.hidden = locked || state.source !== 'bitmap';
  const status=$('#exportStatus');
  if(locked){
    setExportStatus(status, tt('export.waiting'));
  } else {
    setExportStatus(status, (state.source === 'bitmap' && !state.recon) ? tt('export.needRecon') : tt('export.ready'));
  }
  document.querySelectorAll('#exportActions [data-export]').forEach(btn=>btn.disabled = locked);
  const confirm=$('#exportConfirm'); if(confirm) confirm.disabled = locked || !state.target;
  if(!locked) syncExportSelection();
}
function syncExportSelection(){
  const state=window.__ffExportState;
  document.querySelectorAll('#exportActions [data-export]').forEach(btn=>{
    const selected=!!state.svg && btn.dataset.export===state.target;
    btn.classList.toggle('selected',selected);
    btn.setAttribute('aria-pressed',String(selected));
  });
  const confirm=$('#exportConfirm');
  if(confirm) confirm.disabled=!state.svg || !state.target;
}
/* Accepts either a bare SVG string (the SVG path) or
   { svg, source, bitmap } (the bitmap path). Both call sites exist, and a mismatch here
   silently leaves the export buttons disabled, so the shape is normalised up front. */
function showEditableExportStep(svgOrSource){
  const src = (svgOrSource && typeof svgOrSource === 'object')
    ? svgOrSource
    : { svg: svgOrSource, source: 'svg' };
  const svg = src.svg || '';
  try{
    window.__ffExportState = Object.assign(window.__ffExportState, {
      svg: svg, baseSvg: svg,
      source: src.source || 'svg',
      bitmap: src.bitmap || '',
      recon: null,
      scene: svg ? parseSvgScene(svg) : null,
      target: 'svg', font:'original',
    });
    renderEditableExportCard();
  }
  catch(e){ console.warn('editable export scene parse failed', e); return; }
  const card=$('#card4'); if(card) card.scrollIntoView({behavior:'smooth',block:'start'});
}

/* A finished file is offered as a link as well as auto-downloaded: the browser can drop
   an automatic download without telling anyone, and then a successful export looks like
   nothing happened. */
function offerDownload(container, filename, blobOrText, mime){
  if(!container) return;
  const blob = (blobOrText instanceof Blob) ? blobOrText : new Blob([blobOrText], {type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const size = blob.size < 1024 ? (blob.size + ' B') : (Math.round(blob.size/1024) + ' KB');
  const row = document.createElement('div');
  row.className = 'export-dl';
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.textContent = tt('export.getFile', { format: filename });
  const s = document.createElement('span');
  s.textContent = tt('export.fileReady', { size: size });
  row.appendChild(a); row.appendChild(s);
  const old = container.querySelector('.export-dl');
  if(old){
    // Release the previous export's object URL only now, when it is being replaced.
    // The automatic download frees its own URL after a few seconds, but this link has to
    // stay usable for as long as it is on screen: revoking it on a timer is what made a
    // later click do nothing.
    if(old.dataset.objectUrl) { try{ URL.revokeObjectURL(old.dataset.objectUrl); }catch(e){} }
    old.remove();
  }
  row.dataset.objectUrl = url;
  container.appendChild(row);
}

/* Some strings must never degrade into a raw key. If the dictionary is a cached older
   copy it can be missing a key entirely, and tt() then returns the key itself, so the
   user reads "export.getFile". These fallbacks keep the export usable in that case. */
const EXPORT_TEXT = {
  en: { 'export.getFile':'Download {format}', 'export.fileReady':'{size} ready - click if it did not start',
        'export.building':'Building {format}...', 'export.ready':'Choose a format, then click "Confirm and export".',
        'export.needRecon':'Exported as a picture for now. Use the rebuild button above to turn it into editable text.' },
  zh: { 'export.getFile':'下载 {format}', 'export.fileReady':'{size} 已生成——若未自动下载请点这里',
        'export.building':'正在生成 {format}…', 'export.ready':'请选择格式，然后点击“确认设置并导出”。',
        'export.needRecon':'当前导出为图片。点上方按钮可转为可编辑文字。' }
};
function exportText(key, vars){
  let s = tt(key, vars);
  // tt() returns the key itself when the dictionary has no entry for it
  if(s === key){
    const lang = (window.GAL_I18N && window.GAL_I18N.lang) || 'en';
    const table = EXPORT_TEXT[lang] || EXPORT_TEXT.en;
    s = table[key] || EXPORT_TEXT.en[key] || key;
  }
  if(vars) s = String(s).replace(/\{(\w+)\}/g, function(m, k){ return vars[k] != null ? vars[k] : m; });
  return s;
}

/* Write the message into a child element rather than into the container's textContent:
   assigning textContent clears every child, which would wipe the download link that the
   export puts in the same box. The container's original static text is cleared once, so
   the seed message from the markup cannot linger beside the live one. */
function setExportStatus(container, text){
  if(!container) return;
  let msg = container.querySelector('.export-msg');
  if(!msg){
    msg = document.createElement('div');
    msg.className = 'export-msg';
    container.insertBefore(msg, container.firstChild);
    Array.prototype.slice.call(container.childNodes).forEach(function(node){
      if(node !== msg && node.nodeType === 3) container.removeChild(node);
    });
  }
  msg.textContent = text;
}

/* A determinate bar for the export. The work runs in stages whose counts are known, so
   the bar reports real progress instead of an indefinite spinner. */
function showExportProgress(container, label){
  if(!container) return null;
  let box = container.querySelector('.export-progress');
  if(!box){
    box = document.createElement('div');
    box.className = 'export-progress';
    box.innerHTML = '<div class="export-progress-label"></div>' +
                    '<div class="export-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">' +
                    '<div class="export-progress-fill"></div></div>';
    const msg = container.querySelector('.export-msg');
    if(msg && msg.nextSibling) container.insertBefore(box, msg.nextSibling);
    else container.appendChild(box);
  }
  const lab = box.querySelector('.export-progress-label');
  if(lab) lab.textContent = label || '';
  // Reset to empty here, not only when the element is created: a second export reuses the
  // same bar, and a bar left showing the previous run reads as "no progress at all".
  const fill = box.querySelector('.export-progress-fill');
  if(fill) fill.style.width = '0%';
  const track = box.querySelector('.export-progress-track');
  if(track) track.setAttribute('aria-valuenow', '0');
  return box;
}
function setExportProgress(container, percent){
  const box = container && container.querySelector('.export-progress');
  if(!box) return;
  const clamped = Math.max(0, Math.min(100, Math.round(percent)));
  const fill = box.querySelector('.export-progress-fill');
  const track = box.querySelector('.export-progress-track');
  if(fill) fill.style.width = clamped + '%';
  if(track) track.setAttribute('aria-valuenow', String(clamped));
}
function clearExportProgress(container){
  const box = container && container.querySelector('.export-progress');
  if(box) box.remove();
}

/* Advance the bar across the stages the export actually performs. The label carries the
   stage name only; the status message above it already says what is being built, so
   repeating it here would read as duplicated text. */
function runStagedProgress(container, label, steps, task){
  const box = showExportProgress(container, steps[0].label || '');
  setExportProgress(container, steps[0].at * 100);
  let i = 1;
  const timer = setInterval(function(){
    if(i >= steps.length){ clearInterval(timer); return; }
    setExportProgress(container, steps[i].at * 100);
    const lab = box && box.querySelector('.export-progress-label');
    if(lab) lab.textContent = steps[i].label || '';
    i++;
  }, 140);
  const done = function(){ clearInterval(timer); };
  return Promise.resolve()
    .then(task)
    .then(function(v){ done(); setExportProgress(container, 0.97); return v; },
          function(e){ done(); setExportProgress(container, 1); throw e; });
}

/* Keep the label visible while work runs, so a slow build never looks like a no-op. */
function setBusy(btn, busy, label){
  if(!btn) return;
  btn.disabled = !!busy;
  btn.setAttribute('aria-busy', busy ? 'true' : 'false');
  btn.classList.toggle('is-busy', !!busy);
  if(busy){
    if(btn.dataset.idle === undefined) btn.dataset.idle = btn.textContent;
    btn.textContent = '';
    const sp = document.createElement('span');
    sp.className = 'btn-spin';
    sp.setAttribute('aria-hidden', 'true');
    btn.appendChild(sp);
    const tx = document.createElement('span');
    tx.textContent = label || tt('export.working');
    btn.appendChild(tx);
  }else{
    btn.classList.remove('is-busy');
    if(btn.dataset.idle !== undefined){ btn.textContent = btn.dataset.idle; delete btn.dataset.idle; }
  }
}

function initEditableExport(){
  const actions=$('#exportActions'); if(!actions || actions.dataset.bound) return; actions.dataset.bound='1';
  actions.addEventListener('click',e=>{
    const btn=e.target.closest('[data-export]'); if(!btn) return; const st=window.__ffExportState;
    if(!st.svg){
      setExportStatus($('#exportStatus'), tt('export.waiting'));
      return;
    }
    st.target=btn.dataset.export; syncExportSelection();
    // Not written into the status box: that would clear the progress bar or the download
    // link an in-flight export had put there.
    st.selectionNote = tt('export.selection',{format:st.target.toUpperCase()});
  });
  $('#exportConfirm')?.addEventListener('click', async ()=>{
    const st=window.__ffExportState;
    if(!st.svg || !st.target){
      const s2=$('#exportStatus');
      if(s2) s2.textContent = tt('export.waiting');
      return;
    }
    const target=st.target, status=$('#exportStatus'), btn=$('#exportConfirm');
    const setStatus=(k,vars)=>{ setExportStatus(status, tt(k,vars)); };
    // Declared before anything uses it: the progress helpers below need the format name,
    // and a const in the temporal dead zone would throw and skip the bar entirely.
    const fmtName = (target==='drawio') ? 'drawio' : target.toUpperCase();
    showExportProgress(status, '');
    setExportProgress(status, 0.08);
    const scene=st.scene || (st.scene = (function(){ try{ return parseSvgScene(st.svg); }catch(e){ return null; } })());
    setExportProgress(status, 0.34);
    if(!scene){
      setStatus('export.failed',{format:target.toUpperCase()});
      return;
    }
    const fontChoice = st.font && st.font!=='original' ? st.font : 'Arial';
    setBusy(btn, true, exportText('export.building', { format: fmtName }));
    if(status) status.classList.add('export-busy');
    setExportStatus(status, exportText('export.building', { format: fmtName }));
    // The stages below match what the code actually does, so the bar reflects real work:
    // read the scene, build the format, pack it, hand over the file.
    const STEPS = [
      { at:0.08, label:'' },
      { at:0.34, label:'· ' + tt('export.stage.scene') },
      { at:0.68, label:'· ' + tt('export.stage.build') },
      { at:0.88, label:'· ' + tt('export.stage.pack') },
    ];
    try{
      let dlName = 'figure-forge-editable.' + (target==='drawio' ? 'drawio' : target);
      let dlData = null, dlMime = '';
      if(target==='svg'){
        dlData = st.svg; dlMime = 'image/svg+xml;charset=utf-8';
        downloadText(dlName, st.svg, dlMime);
      } else if(target==='drawio'){
        dlData = sceneToDrawio(scene); dlMime = 'application/xml;charset=utf-8';
        downloadText(dlName, dlData, dlMime);
      } else if(target==='pptx'){
        dlData = await buildPptx(scene); dlMime = 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
        downloadBlob(dlName, dlData);
      } else if(target==='vsdx'){
        dlData = zipStore(sceneToVsdxFiles(scene, fontChoice)); dlMime = 'application/vnd.ms-visio.drawing';
        downloadBlob(dlName, dlData);
      }
      setExportProgress(status, 1);
      // also offered as a link, so the result is visible even if the automatic
      // download was blocked or dropped
      offerDownload(status, dlName, dlData, dlMime);
      setExportStatus(status, exportText('export.finished',{format:target==='drawio'?'draw.io':target.toUpperCase()}));
    }catch(err){
      console.warn('editable export failed', err);
      clearExportProgress(status);
      setExportStatus(status, exportText('export.failed',{format:target==='drawio'?'draw.io':target.toUpperCase()}));
    }finally{
      setBusy(btn, false);
      if(status) status.classList.remove('export-busy');
    }
  });
  $('#exportFont')?.addEventListener('change',e=>applyExportFont(e.target.value));
}
initEditableExport();
